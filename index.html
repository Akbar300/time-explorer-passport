<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}#app{min-height:60vh;position:relative;z-index:1;}</style></head><body>
<title>Time Explorer Passport</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>/* Layout: a navy passport-cover bar on top; each mission opens like a security-printed visa page.
   One step on screen at a time (short, visual, rewarding).
   Two themes: Day (pale paper pages) and Night (deep-navy pages). The top bar stays navy in both. */
:root{
  /* fixed brand colors (same in both themes) */
  --navy-900:#0b1a31; --navy-800:#10264a; --navy-700:#183460; --navy-600:#22447a;
  --gold:#d9b45f; --gold-2:#f0d68e; --gold-dim:#8f7641; --lime:#b8e04f; --red:#bf463d; --ok:#2c8a57;
  --f-display:"Archivo Black","Arial Black",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Verdana,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-s:9px;

  /* DAY theme */
  --bg:#e7edf5; --glow-1:#c3d3ea88; --glow-2:#d7e3f288;
  --ink:#13233a; --muted:#4f6078;
  --panel:#ffffff; --panel-2:#e2e9f2; --panel-line:#cad5e3; --stem:#9fb0c6;
  --eyebrow:#87631a; --eyebrow-2:#7a5a14; --year:#87631a;
  --page:#edf3ef; --page-2:#e2ebe6; --page-line:#cddbd4; --page-ink:#15243a; --page-muted:#55647a; --page-head:#183460;
  --pattern:#b9cfc533; --card:#ffffff; --card-soft:#ffffffaa; --ring:#9fb3a9;
  --kick:#1c8a7f; --teal:#249e92; --teal-2:#2fc0b1;
  --btn:#183460; --btn-sh:#0b1a31; --tile-seen:#183460;
  --okbg:#e3f4ea; --okline:#9cd1b3; --nobg:#fbe9e7; --noline:#e7b0aa;
  --dykbg:#eef6e0; --dykline:#a9c56e; --dykink:#5d7a1d; --pickbg:#e6f6f3;
  --mrz-ink:#22344d; --mrz-bg:#ffffff7a;
  --sea:#cfe0e8; --land:#efe6cf; --coast:#7a6a48; --river:#2c6aa3; --grat:#9db7c6; --grat-eq:#7fa0b3;
  --geo-ink:#35506a; --map-ink:#15243a; --halo:#ffffffee; --scale-bg:#ffffffb3; --scale-ink:#2a3b52;
  --shadow:0 10px 26px #1b2d4a26; --shadow-lg:0 16px 36px #1b2d4a33;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0b1a31; --glow-1:#1b3a6b55; --glow-2:#12305a66;
  --ink:#eef2f8; --muted:#a8b6cc;
  --panel:#10264a; --panel-2:#1d3558; --panel-line:#ffffff1c; --stem:#ffffff40;
  --eyebrow:#d9b45f; --eyebrow-2:#f0d68e; --year:#f0d68e;
  --page:#13233b; --page-2:#1b2e4a; --page-line:#2c4466; --page-ink:#e6edf6; --page-muted:#9fb0c7; --page-head:#f3dfa6;
  --pattern:#ffffff07; --card:#1a2c47; --card-soft:#1a2c47cc; --ring:#3a5478;
  --kick:#3fd0c0; --teal:#249e92; --teal-2:#2fc0b1;
  --btn:#2a5596; --btn-sh:#0b1a31; --tile-seen:#2a5596;
  --okbg:#173d2c; --okline:#2c8a57; --nobg:#4a1f1d; --noline:#bf463d;
  --dykbg:#1d3121; --dykline:#5d7a1d; --dykink:#c4e86a; --pickbg:#123d3a;
  --mrz-ink:#b8c7dc; --mrz-bg:#0b1a3166;
  --sea:#17304c; --land:#45402f; --coast:#b9a77a; --river:#6fb1e8; --grat:#2b4a6c; --grat-eq:#3d6189;
  --geo-ink:#b9cde0; --map-ink:#f3ecd8; --halo:#0d1d33ee; --scale-bg:#0b1a31b3; --scale-ink:#d7e2ef;
  --shadow:0 10px 30px #0006; --shadow-lg:0 16px 40px #0008;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1a31; --glow-1:#1b3a6b55; --glow-2:#12305a66;
  --ink:#eef2f8; --muted:#a8b6cc;
  --panel:#10264a; --panel-2:#1d3558; --panel-line:#ffffff1c; --stem:#ffffff40;
  --eyebrow:#d9b45f; --eyebrow-2:#f0d68e; --year:#f0d68e;
  --page:#13233b; --page-2:#1b2e4a; --page-line:#2c4466; --page-ink:#e6edf6; --page-muted:#9fb0c7; --page-head:#f3dfa6;
  --pattern:#ffffff07; --card:#1a2c47; --card-soft:#1a2c47cc; --ring:#3a5478;
  --kick:#3fd0c0; --teal:#249e92; --teal-2:#2fc0b1;
  --btn:#2a5596; --btn-sh:#0b1a31; --tile-seen:#2a5596;
  --okbg:#173d2c; --okline:#2c8a57; --nobg:#4a1f1d; --noline:#bf463d;
  --dykbg:#1d3121; --dykline:#5d7a1d; --dykink:#c4e86a; --pickbg:#123d3a;
  --mrz-ink:#b8c7dc; --mrz-bg:#0b1a3166;
  --sea:#17304c; --land:#45402f; --coast:#b9a77a; --river:#6fb1e8; --grat:#2b4a6c; --grat-eq:#3d6189;
  --geo-ink:#b9cde0; --map-ink:#f3ecd8; --halo:#0d1d33ee; --scale-bg:#0b1a31b3; --scale-ink:#d7e2ef;
  --shadow:0 10px 30px #0006; --shadow-lg:0 16px 40px #0008;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--f-body);min-height:100vh;
  background-image:radial-gradient(1200px 600px at 80% -10%,var(--glow-1),transparent 70%),radial-gradient(900px 500px at -10% 30%,var(--glow-2),transparent 70%);
  background-attachment:fixed;min-height:100%;transition:background-color .3s,color .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy-800)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.12;text-wrap:balance;margin:0;letter-spacing:.01em}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.mono{font-family:var(--f-mono)}
.eyebrow{font:600 12px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

/* top bar: the navy passport cover, same in both themes */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--navy-800) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid #ffffff14;color:#eef2f8}
.bar-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;min-width:0}
.brand svg{flex:none}
.brand b{font:400 15px/1 var(--f-display);letter-spacing:.06em;color:var(--gold-2);white-space:nowrap}
.brand small{display:block;font:500 10px/1.3 var(--f-mono);letter-spacing:.16em;color:#a8b6cc;text-transform:uppercase}
.chips{margin-left:auto;display:flex;gap:6px;flex:none;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 13px/1 var(--f-mono);padding:7px 10px;border-radius:999px;background:var(--navy-700);border:1px solid #ffffff1c;font-variant-numeric:tabular-nums}
.chip.xp{color:var(--lime)} .chip.st{color:var(--gold-2)}
.themebtn{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--navy-700);border:1px solid #ffffff26;color:var(--gold-2);flex:none}
.themebtn svg{width:18px;height:18px}
.themebtn:hover{border-color:var(--gold)}
.themebtn:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px}
@media (max-width:380px){.brand small{display:none}.chip{padding:7px 8px}}

/* passport data page */
.datapage{margin-top:18px;border-radius:18px;background:var(--page);color:var(--page-ink);overflow:hidden;position:relative;
  background-image:repeating-radial-gradient(circle at 105% -20%,transparent 0 11px,var(--pattern) 11px 12px),repeating-linear-gradient(115deg,transparent 0 14px,var(--pattern) 14px 15px);
  box-shadow:var(--shadow-lg),inset 0 0 0 1px var(--page-line)}
.dp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px dashed var(--page-line)}
.dp-head .t{font:400 13px/1.2 var(--f-display);letter-spacing:.12em;color:var(--page-head)}
.dp-head .t span{color:var(--page-muted);font:500 11px var(--f-mono);letter-spacing:.12em;display:block;margin-top:3px}
.dp-body{display:grid;grid-template-columns:auto 1fr;gap:16px 20px;padding:18px}
.avatar{width:104px;height:128px;border-radius:10px;background:linear-gradient(160deg,var(--navy-700),var(--navy-900));display:grid;place-items:center;position:relative;overflow:hidden;border:3px solid var(--card)}
.avatar svg{width:84px;height:84px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 16px;min-width:0}
.field label,.field .lab{display:block;font:600 10.5px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--page-muted);margin-bottom:3px}
.field .v{font:700 18px/1.2 var(--f-mono);color:var(--page-ink);font-variant-numeric:tabular-nums}
.field input{width:100%;font:700 18px/1.2 var(--f-mono);color:var(--page-ink);background:transparent;border:0;border-bottom:2px dashed var(--page-line);padding:2px 0;text-transform:uppercase}
.field input::placeholder{color:var(--page-muted)}
.field input:focus{outline:none;border-bottom-color:var(--teal)}
.xpbar{height:10px;border-radius:99px;background:var(--page-2);overflow:hidden;margin-top:6px;box-shadow:inset 0 0 0 1px var(--page-line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--lime));border-radius:99px;transition:width .6s}
.mrz{font:500 clamp(10px,2.3vw,15px)/1.45 var(--f-mono);letter-spacing:.12em;color:var(--mrz-ink);background:var(--mrz-bg);padding:10px 18px;white-space:nowrap;overflow:hidden;border-top:1px solid var(--page-line)}

/* section heads on the page background */
.sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(22px,4.4vw,30px);color:var(--ink)}
.sec-h p{margin:0;color:var(--muted);font-size:15px}

/* maps */
.mapbox{border-radius:var(--r);overflow:hidden;background:var(--sea);box-shadow:var(--shadow)}
svg.wmap,svg.rmap{display:block;width:100%;height:auto}
.sea{fill:var(--sea)} .sea-in{fill:var(--sea);stroke:var(--coast);stroke-width:.8}
.land{fill:var(--land);stroke:var(--coast);stroke-width:.8;stroke-linejoin:round}
.grat{fill:none;stroke:var(--grat);stroke-width:.5;stroke-dasharray:2 3}
.grat.eq{stroke:var(--grat-eq);stroke-dasharray:6 4}
.river{fill:none;stroke:var(--river);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.geo-lbl{font:italic 600 14px var(--f-body);fill:var(--geo-ink);paint-order:stroke;stroke:var(--halo);stroke-width:3px}
.rpin-dot{fill:var(--red);stroke:#fff;stroke-width:2}
.rpin-halo{fill:#bf463d33}
.rpin-lbl{font:700 15px var(--f-body);fill:var(--map-ink);paint-order:stroke;stroke:var(--halo);stroke-width:4px}
.scale path{stroke:var(--scale-ink);stroke-width:2;fill:none}.scale text{font:600 12px var(--f-mono);fill:var(--scale-ink)}.scale-bg{fill:var(--scale-bg)}
.compass path{fill:var(--geo-ink)}.compass .n{fill:var(--red)}.compass text{font:700 13px var(--f-mono);fill:var(--scale-ink)}
.pin{cursor:pointer}
.pin-dot{fill:var(--red);stroke:#fff;stroke-width:2.5;transition:r .2s}
.pin-halo{fill:#bf463d30}
.pin.done .pin-dot{fill:var(--ok)}
.pin.done .pin-halo{fill:#2c8a5733}
.pin:hover .pin-dot,.pin:focus .pin-dot{r:10}
.pin-lbl{font:700 15px var(--f-body);fill:var(--map-ink);text-anchor:middle;paint-order:stroke;stroke:var(--halo);stroke-width:4px}
@media (max-width:620px){.pin-lbl{font-size:21px}.pin-dot{r:9}.rpin-lbl{font-size:22px}.geo-lbl{font-size:19px}.scale text{font-size:16px}}

/* timeline */
.tl{position:relative;overflow-x:auto;border-radius:var(--r);background:var(--panel);border:1px solid var(--panel-line);scrollbar-color:var(--panel-2) transparent;box-shadow:var(--shadow)}
.tl-in{position:relative}
.tl-axis{position:absolute;left:0;right:0;height:2px;background:var(--gold-dim)}
.tl-tick{position:absolute;font:600 11px var(--f-mono);color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.tl-tick::before{content:"";display:block;width:1px;height:14px;background:var(--gold-dim);margin:0 auto 3px}
.tl-ev{position:absolute;width:150px;transform:translateX(-8px);font-size:13px;line-height:1.3;color:var(--ink)}
.tl-ev b{display:block;font:700 11px var(--f-mono);color:var(--year);letter-spacing:.04em}
.tl-ev .stem{position:absolute;left:8px;width:0;border-left:1px dashed var(--stem)}
.tl-ev .dot{position:absolute;left:3px;width:11px;height:11px;border-radius:50%;border:2px solid var(--panel);z-index:1;box-shadow:0 0 0 1px var(--stem)}
.tl-ev .lnk{all:unset;cursor:pointer;display:block;padding:2px 4px 2px 14px;border-radius:6px}
.tl-ev .lnk:hover{background:var(--panel-2)}
.tl-ev .lnk:focus-visible{outline:2px solid var(--gold)}
.tlf{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tlchip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;font:700 12.5px/1 var(--f-mono);background:var(--panel);color:var(--ink);border:1px solid var(--panel-line)}
.tlchip i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--stem)}
.tlchip[aria-pressed="false"]{background:transparent;color:var(--muted);text-decoration:line-through;border-style:dashed;border-color:var(--stem)}
.tlchip[aria-pressed="false"] i{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.tlchip.all{background:var(--gold);color:var(--navy-900);border-color:var(--gold)}
.tlchip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tl-hint{font:600 12px var(--f-mono);color:var(--muted);margin-top:8px}

/* mission cards */
.qgroup{margin-top:22px}
.qgroup h3{font:600 13px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.qgroup h3::after{content:"";flex:1;height:1px;background:var(--panel-line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mcard{all:unset;cursor:pointer;display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;background:var(--panel);border:1px solid var(--panel-line);transition:transform .2s,border-color .2s;min-width:0;box-shadow:var(--shadow)}
.mcard:hover{transform:translateY(-3px);border-color:var(--gold-dim)}
.mcard:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mcard .thumb{aspect-ratio:16/8;background:var(--navy-700) center/cover no-repeat;position:relative}
.mcard .thumb .tag{position:absolute;left:10px;top:10px;font:700 11px/1 var(--f-mono);letter-spacing:.1em;background:#0b1a31d9;color:var(--gold-2);padding:6px 8px;border-radius:6px}
.mcard .thumb .got{position:absolute;right:8px;bottom:-22px;width:64px;height:64px;transform:rotate(-12deg);filter:drop-shadow(0 3px 4px #0006)}
.mcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.mcard h4{margin:0;font:400 19px/1.15 var(--f-display);color:var(--ink);padding-right:58px}
.mcard .meta{font:600 12px/1.3 var(--f-mono);color:var(--muted)}
.mcard .opt{font-size:12.5px;color:var(--eyebrow);font-family:var(--f-mono)}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:4px}
.segs i{height:6px;border-radius:3px;background:var(--panel-2)}
.segs i.on{background:var(--teal-2)}

/* stamp pages */
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;padding:16px;border-radius:var(--r);background:var(--page);box-shadow:var(--shadow);
  background-image:repeating-linear-gradient(115deg,transparent 0 14px,var(--pattern) 14px 15px)}
.slot{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--page-muted);font:600 11px/1.25 var(--f-mono);letter-spacing:.04em}
.slot .ring{width:100%;aspect-ratio:1;border-radius:50%;border:2px dashed var(--ring);display:grid;place-items:center;overflow:hidden}
.slot img,.slot svg.cst{width:100%;height:100%;object-fit:contain}
.slot .ghost{opacity:.17;filter:grayscale(1)}
.slot.got .ring{border-color:transparent}
.slot.got{color:var(--page-ink)}
.slot:focus-visible{outline:3px solid var(--teal)}

/* module view */
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;margin-top:16px;font:700 14px var(--f-mono);color:var(--eyebrow-2);letter-spacing:.06em}
.back:focus-visible{outline:2px solid var(--gold)}
.mhero{margin-top:12px;border-radius:18px;overflow:hidden;position:relative;background:var(--navy-700);box-shadow:var(--shadow-lg)}
.mhero img,.mhero svg.banner{display:block;width:100%;aspect-ratio:16/8.4;max-height:460px;object-fit:cover}
.mhero .shade{position:absolute;inset:auto 0 0 0;padding:60px 18px 16px;background:linear-gradient(transparent,#08142ae6 70%)}
.mhero h1{font-size:clamp(28px,6vw,48px);color:#fff;text-shadow:0 2px 12px #000a}
.mhero .sub{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pill{font:700 12px/1 var(--f-mono);letter-spacing:.06em;padding:7px 10px;border-radius:999px;background:#ffffff1f;color:#fff;border:1px solid #ffffff33}
.pill.g{background:var(--gold);color:var(--navy-900);border-color:var(--gold)}
.cap{font-size:14px;color:var(--muted);margin:10px 4px 0;font-style:italic}
.cap b{font-style:normal;color:var(--eyebrow);font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;margin-right:6px}

.steps{display:flex;gap:6px;margin:18px 0 12px;overflow-x:auto;padding-bottom:4px}
.step{all:unset;cursor:pointer;flex:1 0 auto;display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--panel-line);font:700 13px/1 var(--f-mono);color:var(--muted);white-space:nowrap}
.step .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--panel-2)}
.step.cur{background:var(--gold);color:var(--navy-900);border-color:var(--gold)}
.step.cur .n{background:#0b1a3122}
.step.done .n{background:var(--teal);color:#fff}
.step:focus-visible{outline:3px solid var(--gold)}

.vpage{border-radius:18px;background:var(--page);color:var(--page-ink);padding:22px clamp(16px,4vw,32px) 26px;position:relative;
  background-image:repeating-radial-gradient(circle at 110% 110%,transparent 0 12px,var(--pattern) 12px 13px);box-shadow:var(--shadow-lg)}
.vpage h2{font-size:clamp(22px,4.5vw,30px);color:var(--page-head);margin-bottom:6px}
.vpage .lead{font-size:clamp(18px,2.4vw,21px);line-height:1.5;max-width:62ch;margin:6px 0 18px}
.vpage .kicker{font:700 12px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--kick);margin-bottom:6px}
.twocol{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
.twocol > *{min-width:0}
.who{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.who li{padding:10px 12px;border-radius:var(--r-s);background:var(--card-soft);border:1px solid var(--page-line);font-size:15.5px;line-height:1.4}
.who b{display:block;font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--page-head);margin-bottom:2px}
.fig{margin:16px 0 0}
.fig img{width:100%;border-radius:12px;display:block}
.fig figcaption{font-size:14px;color:var(--page-muted);margin-top:6px;font-style:italic}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}

/* GRAPES tiles */
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.tile{all:unset;cursor:pointer;width:58px;height:58px;border-radius:12px;display:grid;place-items:center;font:400 24px/1 var(--f-display);background:var(--card);color:var(--page-head);border:2px solid var(--page-line);position:relative;transition:transform .15s}
.tile small{position:absolute;bottom:-18px;font:600 10px var(--f-mono);color:var(--page-muted);white-space:nowrap;letter-spacing:.02em}
.tile.seen{background:var(--tile-seen);color:var(--gold-2);border-color:var(--tile-seen)}
.tile.cur{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 6px 0 var(--gold)}
.tile:focus-visible{outline:3px solid var(--teal)}
.tiles.has-labels{row-gap:30px;margin-bottom:30px}
@media (max-width:520px){.tiles{gap:6px}.tile{width:46px;height:46px;font-size:20px;border-radius:10px}.tile small{display:none}.tiles.has-labels{row-gap:6px;margin-bottom:16px}}
.gcard{border-radius:14px;background:var(--card);border:1px solid var(--page-line);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start}
.gcard .big{font:400 54px/1 var(--f-display);color:var(--gold);grid-row:span 3}
.gcard h3{font-size:22px;color:var(--page-head)}
.gcard p{margin:0;font-size:17.5px;max-width:60ch}
.dyk{grid-column:2;margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--dykbg);border:1px dashed var(--dykline);font-size:15.5px}
.dyk b{font:700 11px var(--f-mono);letter-spacing:.12em;color:var(--dykink);display:block;margin-bottom:2px}
@media (max-width:520px){.gcard{grid-template-columns:1fr}.gcard .big{grid-row:auto;font-size:40px}.dyk{grid-column:1}}

/* flashcards */
.flash-wrap{display:grid;gap:12px;justify-items:center}
.flash{all:unset;cursor:pointer;width:min(100%,440px);aspect-ratio:3/2;perspective:900px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;-webkit-transition:transform .5s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;text-align:center;padding:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flash .front{background:var(--btn);color:#fff;font:400 clamp(24px,5vw,34px)/1.15 var(--f-display);box-shadow:0 8px 0 var(--btn-sh)}
.flash .front small,.flash .back small{position:absolute;top:12px;left:0;right:0;font:600 11px var(--f-mono);letter-spacing:.14em;color:var(--gold-2);text-transform:uppercase}
.flash .back{background:var(--card);color:var(--page-ink);transform:rotateY(180deg);font-size:clamp(19px,3vw,22px);line-height:1.4;border:2px solid var(--btn)}
.flash .back small{color:var(--kick)}
.flash:focus-visible .front{outline:3px solid var(--gold-2)}
.fbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.count{font:700 13px var(--f-mono);color:var(--page-muted)}

/* buttons */
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:12px;font:700 15px/1 var(--f-mono);letter-spacing:.03em;background:var(--btn);color:#fff;box-shadow:0 4px 0 var(--btn-sh);text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--btn-sh)}
.btn.gold{background:var(--gold);color:var(--navy-900);box-shadow:0 4px 0 var(--gold-dim)}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 #17665e}
.btn.ghost{background:transparent;color:var(--page-head);box-shadow:inset 0 0 0 2px var(--page-head)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px}
.nextrow{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}

/* then & now */
.tn{display:grid;gap:10px;margin:8px 0}
.tn-row{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--card);border:2px solid var(--page-line)}
.tn-row .then{font-size:15.5px}.tn-row .now{font-size:15.5px;font-weight:700;color:var(--page-head)}
.tn-row .then b,.tn-row .now b{display:block;font:700 10.5px var(--f-mono);letter-spacing:.14em;color:var(--page-muted);margin-bottom:2px}
.tn-row .arrow{font:400 22px var(--f-display);color:var(--gold)}
.tn-row.pick{border-color:var(--teal);background:var(--pickbg)}
.tn-row:focus-visible{outline:3px solid var(--teal)}
@media (max-width:520px){.tn-row{grid-template-columns:1fr}.tn-row .arrow{transform:rotate(90deg);justify-self:start}}
.mtl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mtl span{font:600 13px/1.25 var(--f-mono);padding:8px 10px;border-radius:9px;background:var(--btn);color:#fff}
.mtl span b{color:var(--gold-2);margin-right:6px}

/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.qdots{display:flex;gap:5px}
.qdots i{width:12px;height:12px;border-radius:50%;background:var(--page-line)}
.qdots i.r{background:var(--ok)}.qdots i.w{background:var(--red)}.qdots i.c{outline:2px solid var(--page-head);outline-offset:1px}
.qq{font:400 clamp(21px,3.8vw,27px)/1.25 var(--f-display);color:var(--page-head);margin:6px 0 14px;max-width:34ch}
.opts{display:grid;gap:10px}
.opt{all:unset;cursor:pointer;padding:14px 16px;border-radius:12px;background:var(--card);border:2px solid var(--page-line);font-size:18px;display:flex;gap:12px;align-items:center}
.opt .l{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:700 13px var(--f-mono);background:var(--page-2)}
.opt:hover{border-color:var(--page-head)}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--nobg)}.opt.wrong .l{background:var(--red);color:#fff}
.opt[aria-disabled="true"]{cursor:default}
.opt:focus-visible{outline:3px solid var(--teal)}
.why{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:16px}
.why.ok{background:var(--okbg);border:1px solid var(--okline)}.why.no{background:var(--nobg);border:1px solid var(--noline)}
.why b{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;display:block}
.score{text-align:center;padding:10px 0}
.score .big{font:400 64px/1 var(--f-display);color:var(--page-head)}
.score p{margin:8px auto 0;max-width:40ch}

/* boss */
.boss-tag{display:inline-flex;align-items:center;gap:8px;font:700 12px var(--f-mono);letter-spacing:.14em;background:var(--btn);color:var(--lime);padding:7px 10px;border-radius:8px}
.prompt{font-size:18.5px;max-width:62ch;margin:10px 0 14px}
.hints{display:grid;gap:8px;margin:10px 0}
.hint{padding:10px 12px;border-radius:10px;background:var(--card);border:1px dashed var(--teal);font-size:16px}
.hint b{font:700 11px var(--f-mono);color:var(--kick);letter-spacing:.12em;margin-right:6px}
textarea{width:100%;min-height:150px;resize:vertical;border-radius:12px;border:2px solid var(--page-line);padding:12px;font:17px/1.5 var(--f-body);color:var(--page-ink);background:var(--card)}
textarea::placeholder{color:var(--page-muted)}
textarea:focus{outline:none;border-color:var(--teal)}
.wc{font:600 12px var(--f-mono);color:var(--page-muted);margin-top:6px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;font-size:15.5px;margin-top:8px}
.check input{width:20px;height:20px;accent-color:var(--teal)}
.model{margin-top:14px;padding:14px;border-radius:12px;background:var(--card);border-left:5px solid var(--gold)}
.model b{font:700 11px var(--f-mono);letter-spacing:.12em;color:var(--eyebrow);display:block;margin-bottom:4px}
.selfcheck{display:grid;gap:6px;margin-top:12px}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#06101fcc;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.ov-card{width:min(100%,460px);border-radius:20px;background:var(--page);color:var(--page-ink);padding:24px;text-align:center;box-shadow:0 20px 60px #000a}
.ov-card h2{color:var(--page-head);font-size:28px;margin:6px 0}
.ring-t{width:150px;height:150px;margin:12px auto}
.ring-t circle{fill:none;stroke-width:12}
.ring-t .bg{stroke:var(--page-line)}.ring-t .fg{stroke:var(--teal);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring-t text{font:400 44px var(--f-display);fill:var(--page-head)}
.stamp-drop{width:200px;height:200px;margin:6px auto;animation:thud .7s cubic-bezier(.2,1.6,.4,1) both}
.stamp-drop img,.stamp-drop svg{width:100%;height:100%;object-fit:contain}
@keyframes thud{0%{transform:scale(2.4) rotate(-30deg);opacity:0}60%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-10deg)}}
.toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--navy-700);color:var(--lime);font:700 15px var(--f-mono);padding:12px 16px;border-radius:12px;border:1px solid #ffffff2a;box-shadow:0 10px 30px #0008;animation:pop .25s both}
@keyframes pop{from{transform:translate(-50%,-14px);opacity:0}}
.foot{margin-top:40px;color:var(--muted);font-size:13.5px;text-align:center}
.foot a{color:var(--eyebrow-2)}

@media (max-width:720px){.twocol{grid-template-columns:1fr}.dp-body{grid-template-columns:1fr}.avatar{width:88px;height:108px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>window.TEP_DATA={"mods":[{"id":"citizen","unit":"Unit 1","q":"Q1","title":"Ethical & Global Citizen","short":"Citizen","years":"1787 to today","region":"United States","stamp":"stamp-citizen","hero":null,"pins":[{"n":"Philadelphia","lon":-75.16,"lat":39.95}],"box":[-92,24,-64,48],"rivers":[],"labels":[{"t":"Atlantic Ocean","lon":-69,"lat":32}],"hook":"In the summer of 1787, 55 delegates met in Philadelphia and wrote a plan for a brand-new government. That plan, the Constitution, still guides the United States today. It only works when citizens like you do their part.","cardsTitle":"Citizen Toolkit","cards":[{"k":"R","t":"Rights","x":"A right is a freedom you have. The Bill of Rights, the first 10 amendments, protects freedoms like speech, religion, and the press.","f":"The First Amendment protects 5 freedoms: religion, speech, press, assembly, and petition."},{"k":"D","t":"Responsibilities","x":"A responsibility is something you should do: follow rules and laws, respect others, tell the truth, and later vote and serve on a jury.","f":"Rights and responsibilities go together. Your freedom of speech comes with the duty to respect other people's rights."},{"k":"@","t":"Digital Citizenship","x":"Be a good citizen online too: protect passwords and personal information, be kind, think before you post, and check who made a website before you trust it.","f":"Your digital footprint is everything you leave online. It can last a very long time."},{"k":"C","t":"Compromise","x":"When people disagree, each side gives up a little to reach an agreement. The Constitution was built on compromises.","f":"The Great Compromise created a Congress with two houses: the House (seats by population) and the Senate (2 per state)."},{"k":"17","t":"Constitution Day","x":"Celebrated every September 17, the day the delegates signed the Constitution in 1787. The Preamble begins “We the People.”","f":"“We the People” means the government's power comes from the people, not from a king."},{"k":"3","t":"Three Branches","x":"Legislative (Congress) makes laws. Executive (the President) carries out laws. Judicial (the courts) decides what laws mean. Each branch can check the others.","f":"Checks and balances: the President can veto a law, Congress can override a veto, and courts can strike down a law."}],"vocab":[{"t":"citizen","d":"a member of a country with rights and responsibilities"},{"t":"right","d":"a freedom that is protected, like freedom of speech"},{"t":"responsibility","d":"a duty you should do, like following laws"},{"t":"Constitution","d":"the written plan for the U.S. government, signed in 1787"},{"t":"amendment","d":"a change or addition to the Constitution"},{"t":"compromise","d":"each side gives up something to reach an agreement"},{"t":"Preamble","d":"the opening of the Constitution that starts “We the People”"},{"t":"digital footprint","d":"the trail of information you leave online"}],"people":[{"n":"George Washington","d":"Led the Constitutional Convention and became the first President."},{"n":"James Madison","d":"Called the “Father of the Constitution” for planning much of it."},{"n":"Benjamin Franklin","d":"The oldest delegate at 81. He urged everyone to compromise."},{"n":"Independence Hall","d":"The building in Philadelphia where the Constitution was signed."}],"thenNow":[{"then":"Delegates argued for months, then compromised to write the Constitution.","now":"Your class agrees on rules and settles disagreements by compromising."},{"then":"The Bill of Rights was added in 1791 to protect freedoms.","now":"You can share opinions, practice your religion, and read a free press."},{"then":"The Founders feared giving one person too much power.","now":"Checks and balances still limit every branch of government."}],"timeline":[{"y":1787,"e":"Constitution signed"},{"y":1791,"e":"Bill of Rights added"}],"move":"Three Branches Drill: write a law in the air (Legislative), salute (Executive), bang a pretend gavel (Judicial). Repeat 5 times, faster each round!","quiz":[{"q":"On what date is Constitution Day?","c":["September 17","July 4","December 25","January 1"],"a":0,"w":"The delegates signed the Constitution on September 17, 1787."},{"q":"Which of these is a RESPONSIBILITY, not a right?","c":["Freedom of speech","Following laws","Freedom of religion","Freedom of the press"],"a":1,"w":"Following laws is a duty. The others are freedoms protected by the First Amendment."},{"q":"The first ten amendments are called the…","c":["Preamble","Bill of Rights","Articles","Great Compromise"],"a":1,"w":"The Bill of Rights was added in 1791."},{"q":"Who is called the “Father of the Constitution”?","c":["George Washington","Benjamin Franklin","James Madison","Thomas Jefferson"],"a":2,"w":"James Madison planned much of the Constitution."},{"q":"Which branch MAKES laws?","c":["Judicial","Executive","Legislative","Military"],"a":2,"w":"Congress, the legislative branch, makes laws."},{"q":"“We the People” means the government's power comes from…","c":["the king","the people","the army","the courts"],"a":1,"w":"In the U.S., power comes from the citizens."},{"q":"Which is the BEST digital citizenship choice?","c":["Share your password with a friend","Post your home address","Check who made a website before trusting it","Believe everything online"],"a":2,"w":"Good digital citizens check sources and protect their information."},{"q":"A compromise is when…","c":["one side wins everything","each side gives up something to agree","nobody talks","the oldest person decides"],"a":1,"w":"The Constitution itself was built on compromises."}],"aap":{"t":"Where did the Founders get their ideas?","p":"The Founders borrowed ideas from history: Greek democracy (citizens vote), the Roman Republic (elected representatives and a Senate), and England's Magna Carta (even the ruler must obey the law). Pick ONE idea and explain where you can still see it in the U.S. government today.","h":["Pick one: Greece, Rome, or Magna Carta.","Name the idea i 75M0,-5V0M75,-5V0\"/><text x=\"37\" y=\"-6\" text-anchor=\"middle\">500 km</text></g><g class=\"compass\" transform=\"translate(30,34)\"><path d=\"M0,-18L5,0L0,18L-5,0Z\"/><path class=\"n\" d=\"M0,-18L5,0L-5,0Z\"/><text y=\"-22\" text-anchor=\"middle\">N</text></g></svg>"},{"id":"cultures","unit":"Unit 2","q":"Q1","title":"Exploring Culture","short":"Culture","years":"All times, all places","region":"The whole world","stamp":"stamp-cultures","hero":"cultures-hero","heroCap":"Artist's scene: friends sharing food, music, and cloth. Can you spot three culture traits?","pins":[],"box":null,"rivers":[],"labels":[],"hook":"Every group of people in history had to solve the same big problems: what to eat, where to live, how to get along, and what to believe. The way a group solves those problems is its culture.","cardsTitle":"The Culture Wheel","cards":[{"k":"F","t":"Food","x":"What people eat depends on geography: rice where it is wet, wheat where it is drier, fish near the sea.","f":"Maize (corn) was first grown in Mexico about 9,000 years ago."},{"k":"C","t":"Clothing","x":"Clothes fit the climate and show identity: wool in cold mountains, light cotton in hot places.","f":"Silk from China was so valuable that people traded it across 4,000 miles."},{"k":"S","t":"Shelter","x":"People build homes from what is nearby: mud brick in river valleys, stone in mountains, wood in forests.","f":"Mesopotamia had almost no stone, so whole cities were made of sun-dried mud brick."},{"k":"L","t":"Language","x":"Language lets people share ideas and pass down stories. Writing lets ideas last for thousands of years.","f":"The oldest known writing, cuneiform, began about 3200 BCE."},{"k":"B","t":"Beliefs","x":"Religions and beliefs answer big questions about life. They shape holidays, rules, art, and buildings.","f":"Many of the biggest ancient buildings were temples."},{"k":"A","t":"Arts","x":"Music, dance, stories, and buildings show what a culture values and celebrates.","f":"Drums are one of the oldest instruments, found in cultures all over the world."},{"k":"G","t":"Government","x":"Every group needs rules and leaders to keep order and make decisions.","f":"Some cultures had kings, some had councils, and Athens let citizens vote."},{"k":"E","t":"Economy","x":"People trade for what they don't have. Trade spreads goods AND ideas.","f":"When ideas spread from one culture to another, it is called cultural diffusion."}],"vocab":[{"t":"culture","d":"the way of life of a group of people"},{"t":"tradition","d":"a custom passed down from generation to generation"},{"t":"custom","d":"a usual way of doing something in a group"},{"t":"artifact","d":"an object made by people long ago"},{"t":"civilization","d":"a large, organized society with cities, government, and writing"},{"t":"cultural diffusion","d":"the spreading of ideas and goods from one culture to another"},{"t":"identity","d":"who a person or group is and what makes them unique"},{"t":"geography","d":"the land, water, and climate of a place"}],"peopleTitle":"Your explorer toolkit: GRAPES","people":[{"n":"G = Geography","d":"Land, water, and climate. Where is it and what is it like?"},{"n":"R = Religion","d":"Beliefs, gods, holy places, and holidays."},{"n":"A = Achievements","d":"Inventions, art, buildings, and ideas they gave the world."},{"n":"P = Politics","d":"Government: who rules and how laws are made."},{"n":"E = Economy","d":"Jobs, farming, money, and trade."},{"n":"S = Social structure","d":"Groups in society, from the most powerful to the least."}],"thenNow":[{"then":"Silk Road traders carried paper from China to the west.","now":"You write on paper, an invention from ancient China."},{"then":"Mathematicians in India used zero as a number.","now":"Every number you write uses the same 10 digits, including 0."},{"then":"Farmers in Mexico grew the first maize (corn).","now":"Corn is grown and eaten all over the world."}],"timeline":[],"move":"Culture Charades: act out three culture traits for 10 seconds each: eat with chopsticks, play a drum, and stack mud bricks to build a house.","quiz":[{"q":"Which trait do ALL cultures share?","c":["Skyscrapers","Food","Snow","Smartphones"],"a":1,"w":"Every culture has food, shelter, clothing, language, beliefs, arts, government, and an economy."},{"q":"People in a hot river valley with little stone most likely built homes from…","c":["ice blocks","mud brick","rainforest wood","steel"],"a":1,"w":"People build with what is nearby. River clay makes mud brick."},{"q":"Cultural diffusion means…","c":["a culture disappears","ideas and goods spread between cultures","people stop trading","everyone speaks one language"],"a":1,"w":"Trade and travel spread ideas from one culture to another."},{"q":"An artifact is…","c":["a type of weather","an object made by people long ago","a modern factory","a government"],"a":1,"w":"Archaeologists study artifacts to learn about the past."},{"q":"In GRAPES, the P stands for…","c":["People","Places","Politics","Pottery"],"a":2,"w":"Politics means government: who rules and how."},{"q":"Why do cultures in different places eat different foods?","c":["Geography and climate decide what grows","Everyone likes the same food","Food is chosen by the king","There is no reason"],"a":0,"w":"Geography shapes culture. Rice needs lots of water; wheat grows where it is drier."},{"q":"What spreads ideas between cultures the MOST?","c":["Staying home","Trade","Sleeping","Mountains"],"a":1,"w":"Traders carry goods, and with them stories, beliefs, and inventions."},{"q":"A tradition is…","c":["a brand-new invention","a custom passed down over generations","a kind of map","a law"],"a":1,"w":"Holidays and family celebrations are traditions."}],"aap":{"t":"Same problem, different answers","p":"Every culture needs shelter. Compare how TWO places solved this problem differently (for example, Mesopotamia and the Inca). Explain how geography caused the difference, and what stayed the same.","h":["What was the problem both had?","What natural materials did each place have?","What need is universal (the same everywhere)?"],"m":"Both Mesopotamians and the Inca needed strong, safe homes. Mesopotamia had almost no stone or big trees, so people made sun-dried bricks from river clay. The Inca lived in the Andes with lots of stone, so they cut and fitted stone blocks. The need was universal, but geography decided the answer."},"mapSvg":null},{"id":"fertile","unit":"Unit 3","q":"Q1","title":"Mesopotamia & the Fertile Crescent","short":"Mesopotamia","years":"3500–300 BCE","region":"Southwest Asia (today's Iraq)","stamp":"stamp-fertile","hero":"mesopotamia-hero","heroCap":"Artist's scene of a city market by the Euphrates. Look closer: real Mesopotamian buildings were sun-dried mud brick, not cut stone.","extra":{"img":"mesopotamia-school","cap":"Artist's scene of a scribe school. Boys practiced cuneiform by pressing a reed stylus into wet clay."},"pins":[{"n":"Babylon","lon":44.42,"lat":32.54},{"n":"Ur","lon":46.1,"lat":30.96,"dy":12}],"box":[28,22,62,42],"rivers":["tigris","euphrates"],"labels":[{"t":"Tigris R.","lon":44.2,"lat":35.4,"a":"start"},{"t":"Euphrates R.","lon":40.2,"lat":34.2,"a":"end"},{"t":"Persian Gulf","lon":51.0,"lat":27.3},{"t":"Mediterranean","lon":28.8,"lat":33.4,"a":"start"}],"hook":"Between two rivers, the Tigris and the Euphrates, farmers turned a dry land green. Here people built some of the world's first cities and invented writing.","cards":[{"k":"G","t":"Geography","x":"Mesopotamia means “land between the rivers.” The Tigris and Euphrates flooded and left rich soil, but little rain fell, so farmers dug canals to irrigate crops.","f":"There was almost no stone or timber, so people built with mud brick."},{"k":"R","t":"Religion","x":"Sumerians were polytheistic, meaning they believed in many gods. Each city had a ziggurat, a huge stepped temple, at its center.","f":"Priests were powerful because people believed the gods controlled floods and harvests."},{"k":"A","t":"Achievements","x":"Cuneiform writing, the wheel, the plow, sailboats, and a number system based on 60.","f":"Our 60-minute hour and 360-degree circle come from Sumerian base-60 math."},{"k":"P","t":"Politics","x":"Each city-state, like Ur or Uruk, had its own king. Later, King Hammurabi of Babylon united the region and carved one of the first written law codes.","f":"Hammurabi's Code had 282 laws, many based on “an eye for an eye.”"},{"k":"E","t":"Economy","x":"Extra food, called a surplus, let some people become artisans and traders. They traded grain and cloth for metal, wood, and stone from far away.","f":"Scribes kept records of trade and taxes on clay tablets."},{"k":"S","t":"Social","x":"Kings and priests were at the top, then merchants and artisans, then farmers, and enslaved people at the bottom. Scribes who could read and write were respected.","f":"Learning to be a scribe took about 12 years of school."}],"vocab":[{"t":"Fertile Crescent","d":"the curved band of rich farmland in Southwest Asia"},{"t":"irrigation","d":"bringing water to crops with canals or ditches"},{"t":"city-state","d":"a city that rules itself and the land around it"},{"t":"ziggurat","d":"a large stepped temple in Mesopotamia"},{"t":"cuneiform","d":"wedge-shaped writing pressed into clay"},{"t":"polytheism","d":"belief in many gods"},{"t":"surplus","d":"extra food or goods beyond what is needed"},{"t":"scribe","d":"a person whose job was to write and keep records"}],"people":[{"n":"Hammurabi","d":"King of Babylon (about 1754 BCE) who wrote a famous code of laws."},{"n":"Sargon of Akkad","d":"Created the world's first empire, about 2300 BCE."},{"n":"Epic of Gilgamesh","d":"One of the oldest stories ever written, about a hero king."},{"n":"Ur","d":"A Sumerian city with a giant ziggurat."}],"thenNow":[{"then":"Hammurabi's Code was carved in stone for everyone to see.","now":"Laws are written down and public, so everyone knows the rules."},{"then":"Sumerians counted in groups of 60.","now":"60 seconds in a minute, 60 minutes in an hour, 360 degrees in a circle."},{"then":"The wheel was invented for pottery and carts.","now":"Cars, bikes, and gears all use wheels."},{"then":"Scribes wrote on clay tablets.","now":"We write books, emails, and records."}],"timeline":[{"y":-3500,"e":"Sumer's first cities"},{"y":-3200,"e":"Cuneiform writing"},{"y":-2300,"e":"Sargon's empire"},{"y":-1754,"e":"Hammurabi's Code"}],"move":"Ziggurat Climb: march in place up 7 “steps,” wave from the top, then march 7 steps down. Do it 3 times!","quiz":[{"q":"Mesopotamia means…","c":["land of kings","land between the rivers","desert of sand","city of gods"],"a":1,"w":"It sat between the Tigris and Euphrates rivers."},{"q":"Which two rivers made Mesopotamia fertile?","c":["Nile and Congo","Tigris and Euphrates","Indus and Ganges","Huang He and Yangtze"],"a":1,"w":"Their floods left rich soil."},{"q":"Why did Mesopotamians build with mud brick?","c":["They liked the color","There was little stone or timber","Bricks were cheaper to buy","The king ordered it"],"a":1,"w":"Geography decided the building material."},{"q":"Cuneiform is…","c":["a type of boat","wedge-shaped writing on clay","a stepped temple","a law code"],"a":1,"w":"Scribes pressed a reed stylus into wet clay."},{"q":"Hammurabi is famous for…","c":["inventing the wheel","one of the first written law codes","building the pyramids","sailing to India"],"a":1,"w":"His code had 282 laws."},{"q":"Irrigation means…","c":["bringing water to crops","building temples","writing on clay","trading grain"],"a":0,"w":"Farmers dug canals because little rain fell."},{"q":"Our 60-minute hour comes from…","c":["Roman calendars","Sumerian base-60 math","Chinese clocks","Greek myths"],"a":1,"w":"Sumerians counted in 60s."},{"q":"What did a food surplus allow?","c":["Everyone to stop working","Some people to do jobs other than farming","Rivers to stop flooding","Kings to disappear"],"a":1,"w":"Extra food freed people to become artisans, traders, and scribes."}],"aap":{"t":"Geography: gift or challenge?","p":"The rivers gave Mesopotamia rich soil, but floods were unpredictable and there was little rain or stone. Explain how ONE challenge led to an invention or idea that we still use today.","h":["Pick a challenge: floods, little rain, or no stone.","What did people invent to solve it?","Where do we still see that idea?"],"m":"Little rain meant farmers had to control river water. They worked together to dig canals, which needed leaders and careful records, so city-states and writing developed to track grain and water. Writing is still one of the most important inventions in the world."},"mapSvg":"<svg class=\"rmap\" viewBox=\"0 0 600 400\" role=\"img\" aria-label=\"Map of Southwest Asia (today's Iraq)\"><defs><clipPath id=\"clip-fertile\"><rect width=\"600\" height=\"400\" rx=\"12\"/></clipPath></defs><g clip-path=\"url(#clip-fertile)\"><rect class=\"sea\" width=\"600\" height=\"400\"/><path class=\"grat\" d=\"M-39.2,440.0L-39.2,-40.0\"/><path class=\"grat\" d=\"M45.6,440.0L45.6,-40.0\"/><path class=\"grat\" d=\"M130.4,440.0L130.4,-40.0\"/><path class=\"grat\" d=\"M215.2,440.0L215.2,-40.0\"/><path class=\"grat\" d=\"M300.0,440.0L300.0,-40.0\"/><path class=\"grat\" d=\"M384.8,440.0L384.8,-40.0\"/><path class=\"grat\" d=\"M469.6,440.0L469.6,-40.0\"/><path class=\"grat\" d=\"M554.4,440.0L554.4,-40.0\"/><path class=\"grat\" d=\"M639.2,440.0L639.2,-40.0\"/><path class=\"grat\" d=\"M-22.3,440.0L622.3,440.0\"/><path class=\"grat\" d=\"M-22.3,340.0L622.3,340.0\"/><path class=\"grat\" d=\"M-22.3,240.0L622.3,240.0\"/><path class=\"grat\" d=\"M-22.3,140.0L622.3,140.0\"/><path class=\"grat\" d=\"M-22.3,40.0L622.3,40.0\"/><path class=\"grat\" d=\"M-22.3,-60.0L622.3,-60.0\"/><path class=\"land\" d=\"M-563.3,124.0L-495.5,138.0L-412.4,104.0L-317.4,102.0L-290.2,96.0L-275.0,102.0L-285.2,124.0L-275.0,136.0L-291.9,156.0L-268.2,176.0L-239.4,182.0L-205.4,194.0L-181.7,216.0L-154.6,228.0L-130.8,232.0L-122.3,198.0L-81.6,184 8.5},{"t":"Gobi Desert","lon":104.0,"lat":43.5},{"t":"Pacific Ocean","lon":127.0,"lat":25.0}],"hook":"Mountains, deserts, and seas surrounded ancient China, so it grew up mostly on its own. Along the Huang He, or Yellow River, Chinese dynasties invented silk, paper, and a government run by educated officials.","cards":[{"k":"G","t":"Geography","x":"The Huang He carries yellow soil called loess that makes rich farmland, but its floods were so deadly it was called “China's Sorrow.” Farther south, the Yangtze River valley grew rice.","f":"The Himalayas, the Gobi Desert, and the Pacific Ocean isolated China, so its culture grew with few outside influences."},{"k":"R","t":"Religion","x":"Confucianism taught respect for parents and elders, good manners, and that rulers should be fair and set a good example. Families honored their ancestors.","f":"Confucius lived about 551 to 479 BCE. His sayings were collected in a book called the Analects."},{"k":"A","t":"Achievements","x":"Silk, paper (about 105 CE), the compass, the seismograph to detect earthquakes, and the first long walls of rammed earth.","f":"China kept silk-making a secret for centuries. Smuggling silkworms out was a crime."},{"k":"P","t":"Politics","x":"Dynasties, or ruling families, claimed the Mandate of Heaven: the right to rule given by heaven. Qin Shi Huang united China in 221 BCE. The Han dynasty chose officials by exams on Confucian ideas.","f":"Choosing government workers by a test instead of by family began in China."},{"k":"E","t":"Economy","x":"Most people farmed millet, wheat, and rice. The Silk Road carried silk west and brought horses, glass, and new ideas back east.","f":"The Silk Road was not one road but a web of trade routes about 4,000 miles long."},{"k":"S","t":"Social","x":"Family came first. Scholar-officials and nobles were at the top, then farmers (respected for growing food), then artisans, and merchants at the bottom.","f":"Merchants were often rich, but Confucian thinkers gave them low status."}],"vocab":[{"t":"dynasty","d":"a family that rules a country for many years"},{"t":"Mandate of Heaven","d":"the belief that heaven gave a dynasty the right to rule"},{"t":"Confucianism","d":"teachings of Confucius about respect, family, and fair rulers"},{"t":"ancestor","d":"a family member who lived long ago"},{"t":"loess","d":"fine yellow soil carried by the Huang He"},{"t":"Silk Road","d":"trade routes linking China to the Middle East and Europe"},{"t":"civil service exam","d":"a test to choose government officials"},{"t":"isolation","d":"being cut off from other places"}],"people":[{"n":"Confucius","d":"Teacher who taught respect for family and fair government."},{"n":"Qin Shi Huang","d":"First emperor; united China in 221 BCE and made writing, coins, and measures the same everywhere."},{"n":"Han dynasty","d":"Ruled 206 BCE to 220 CE; opened the Silk Road and invented paper."},{"n":"Terracotta Army","d":"About 8,000 clay soldiers buried to guard Qin Shi Huang's tomb."}],"thenNow":[{"then":"Paper was made from tree bark and old rags.","now":"Books, notebooks, and paper money."},{"then":"The Silk Road linked China to faraway lands.","now":"Global trade connects countries around the world."},{"then":"Officials were chosen by exams.","now":"Tests are used to hire teachers, police, and government workers."},{"then":"The compass pointed travelers south.","now":"GPS and navigation apps."}],"timeline":[{"y":-1600,"e":"Shang dynasty: bronze and oracle bones"},{"y":-500,"e":"Confucius teaches"},{"y":-221,"e":"Qin Shi Huang unites China"},{"y":-206,"e":"Han dynasty begins"},{"y":105,"e":"Paper invented"}],"move":"Silk Road Relay: walk 10 steps west carrying an imaginary bolt of silk, trade it, then gallop 10 steps back on your new horse!","quiz":[{"q":"Why was the Huang He called “China's Sorrow”?","c":["It was too cold","Its floods were deadly","It had no fish","It dried up every year"],"a":1,"w":"Its floods destroyed farms and villages."},{"q":"Which of these did NOT isolate China?","c":["Himalayas","Gobi Desert","Pacific Ocean","Mississippi River"],"a":3,"w":"The Mississippi River is in North America."},{"q":"Confucianism teaches…","c":["respect for family and fair rulers","many gods on a mountain","building pyramids","sailing the oceans"],"a":0,"w":"Confucius focused on how people should treat each other."},{"q":"The Mandate of Heaven was…","c":["a type of silk","the belief that heaven gave a dynasty the right to rule","a long wall","a holiday"],"a":1,"w":"If a dynasty ruled badly, people believed it lost the Mandate."},{"q":"Who united China in 221 BCE?","c":["Confucius","Qin Shi Huang","Marco Polo","Ashoka"],"a":1,"w":"He was China's first emperor."},{"q":"The Silk Road was…","c":["one paved highway","trade routes linking China to the west","a river","a silk factory"],"a":1,"w":"It was a web of routes, about 4,000 miles long."},{"q":"Which invention came from ancient China?","c":["The wheel","Paper","Cuneiform","Concrete"],"a":1,"w":"Paper was invented about 105 CE during the Han dynasty."},{"q":"How did the Han dynasty choose government officials?","c":["By coin toss","By exams","By height","By who was oldest"],"a":1,"w":"Civil service exams tested knowledge of Confucian ideas."}],"aap":{"t":"Isolation: help or harm?","p":"Explain ONE way China's isolation helped it and ONE way it limited it. Then decide: overall, did isolation help or hurt? Support your answer.","h":["What natural barriers surrounded China?","How did they protect China?","What did China miss out on, and how did the Silk Road change that?"],"m":"Isolation protected China from many invaders and let it develop its own writing, beliefs, and inventions like silk and paper. But it also made trading and sharing ideas harder. China solved this by building the Silk Road. Overall, isolation helped, because China built a strong culture first and then chose how to connect with others."},"mapSvg":"<svg class=\"rmap\" viewBox=\"0 0 600 400\" role=\"img\" aria-lab =\"4\"/><path d=\"M0,0H49M0,-5V0M49,-5V0\"/><text x=\"25\" y=\"-6\" text-anchor=\"middle\">500 km</text></g><g class=\"compass\" transform=\"translate(30,34)\"><path d=\"M0,-18L5,0L0,18L-5,0Z\"/><path class=\"n\" d=\"M0,-18L5,0L-5,0Z\"/><text y=\"-22\" text-anchor=\"middle\">N</text></g></svg>","guide":"china-guide"},{"id":"india","unit":"Unit 3","q":"Q1","title":"Ancient India","short":"India","years":"2500 BCE–400 CE","region":"South Asia","stamp":"stamp-india","hero":"india-hero","heroCap":"Artist's scene of Mohenjo-daro's Great Bath, built of baked brick about 4,500 years ago.","extra":{"img":"india-stupa","cap":"A Buddhist stupa: a dome built to hold sacred relics. Pilgrims walk around it as a form of prayer."},"pins":[{"n":"Mohenjo-daro","lon":68.14,"lat":27.33},{"n":"Pataliputra","lon":85.14,"lat":25.6}],"box":[58,4,99,38],"rivers":["indus","ganges"],"labels":[{"t":"Indus R.","lon":70.6,"lat":30.4},{"t":"Ganges R.","lon":82.0,"lat":24.3},{"t":"Himalayas","lon":84.0,"lat":30.6},{"t":"Arabian Sea","lon":63.5,"lat":16.0},{"t":"Bay of Bengal","lon":89.5,"lat":15.5}],"hook":"In the Indus River Valley, people built planned cities with straight streets and covered drains 4,500 years ago! Later, India became the birthplace of Hinduism and Buddhism, and gave the world the number zero.","cards":[{"k":"G","t":"Geography","x":"The Himalayas block cold winds from the north. Monsoon winds bring heavy summer rain for crops, but too much or too little rain could mean floods or famine. The Indus and Ganges rivers gave fertile soil.","f":"India is a subcontinent: a large landmass cut off from the rest of Asia by mountains."},{"k":"R","t":"Religion","x":"Hinduism: many gods seen as forms of one spirit, Brahman, with karma and reincarnation. Buddhism: Siddhartha Gautama, the Buddha, taught the Eightfold Path to end suffering. Sikhism began much later, about 1500 CE, when Guru Nanak taught belief in one God and equality.","f":"Karma is the idea that your actions have consequences."},{"k":"A","t":"Achievements","x":"Planned cities with sewers, the number zero and place value (our digits are called Hindu-Arabic numerals), chess, cotton cloth, and yoga.","f":"Homes in Mohenjo-daro had bathrooms connected to covered street drains."},{"k":"P","t":"Politics","x":"The Maurya Empire united much of India. Emperor Ashoka, after a bloody war, became a Buddhist, rejected violence, and carved rules of kindness on stone pillars. The Gupta Empire (about 320 to 550 CE) was a golden age.","f":"Ashoka's lion pillar is on India's money and seal today."},{"k":"E","t":"Economy","x":"Farmers grew rice, wheat, and cotton. Traders sold cotton cloth, spices, and gems by land and sea.","f":"Pepper from India was so valuable that people called it “black gold.”"},{"k":"S","t":"Social","x":"The caste system divided people into groups by birth: Brahmins (priests), Kshatriyas (rulers and warriors), Vaishyas (merchants and farmers), and Shudras (workers). Some people outside these groups were treated very unfairly.","f":"Buddhism and Sikhism both taught that people are equal, no matter their birth."}],"vocab":[{"t":"subcontinent","d":"a large landmass that is part of a continent"},{"t":"monsoon","d":"seasonal winds that bring heavy rain"},{"t":"karma","d":"the idea that actions have consequences"},{"t":"reincarnation","d":"the belief that a soul is reborn in a new body"},{"t":"caste","d":"a social group a person is born into"},{"t":"stupa","d":"a dome-shaped Buddhist shrine"},{"t":"nonviolence","d":"refusing to use force to solve problems"},{"t":"place value","d":"the value of a digit depends on its position"}],"people":[{"n":"Mohenjo-daro & Harappa","d":"Planned Indus Valley cities with grid streets and drains."},{"n":"Siddhartha Gautama","d":"A prince who became the Buddha and founded Buddhism."},{"n":"Ashoka","d":"Maurya emperor who turned to peace and spread Buddhism."},{"n":"Guru Nanak","d":"Founded Sikhism about 1500 CE in the Punjab region."}],"thenNow":[{"then":"Indian mathematicians used zero and place value.","now":"Every math problem you solve uses them."},{"then":"Mohenjo-daro had covered drains under its streets.","now":"Cities have sewer systems."},{"then":"Ashoka promoted nonviolence.","now":"Gandhi and Dr. Martin Luther King Jr. led nonviolent protests."},{"then":"Indians played chaturanga, an early chess.","now":"Chess is played all over the world."}],"timeline":[{"y":-2500,"e":"Indus Valley cities"},{"y":-500,"e":"The Buddha teaches"},{"y":-260,"e":"Ashoka turns to peace"},{"y":320,"e":"Gupta golden age"}],"move":"Monsoon Moves: wiggle your fingers down like rain (10 seconds), stomp like thunder (10 seconds), then reach up tall like a rice plant (10 seconds).","quiz":[{"q":"What are monsoons?","c":["Seasonal winds that bring heavy rain","Tall mountains","Holy books","Trade ships"],"a":0,"w":"Monsoons bring summer rain that farmers need."},{"q":"Which mountains form India's northern wall?","c":["Andes","Alps","Himalayas","Rockies"],"a":2,"w":"The Himalayas are the tallest mountains on Earth."},{"q":"Mohenjo-daro was famous for…","c":["giant pyramids","planned streets and covered drains","floating gardens","stone heads"],"a":1,"w":"It was one of the best-planned cities of the ancient world."},{"q":"Who founded Buddhism?","c":["Ashoka","Guru Nanak","Siddhartha Gautama","Confucius"],"a":2,"w":"He became known as the Buddha, the “enlightened one.”"},{"q":"Karma is the idea that…","c":["actions have consequences","rivers flood","kings rule forever","trade spreads ideas"],"a":0,"w":"It is a key idea in Hinduism and Buddhism."},{"q":"Which number idea came from ancient India?","c":["Roman numerals","Zero and place value","Base 60","Tally marks"],"a":1,"w":"Indian numerals spread through Arab traders to Europe."},{"q":"Ashoka is remembered for…","c":["building a great wall","turning to peace and spreading Buddhism","sailing to America","inventing paper"],"a":1,"w":"He carved messages of kindness on stone pillars."},{"q":"The caste system divided people by…","c":["the family they were born into","their height","how fast they ran","their favorite food"],"a":0,"w":"A person's caste was set at birth."}],"aap":{"t":"India's gift to math","p":"Explain why zero and place value were such a big deal. How would math be harder with Roman numerals, which have no zero?","h":["What does a 0 do in 205 compared to 25?","Try writing 1,888 in Roman numerals: MDCCCLXXXVIII.","How did Indian numbers reach the rest of the world?"],"m":"With place value and zero, just 10 digits can write any number, and zero holds an empty place, so 205 and 25 are different. Roman numerals have no zero, so 1,888 becomes MDCCCLXXXVIII and adding or multiplying is very hard. Indian numerals spread through Arab traders to Europe, and now the whole world uses them."},"mapSvg":"<svg class=\"rmap\" viewBox=\"0 0 600 400\" role=\"img\" aria-label=\"Map of South Asia\"><defs><clipPath id=\"clip-india\"><rect width=\"600\" height=\"400\" rx=\"12\"/></clipPath></defs><g clip-path=\"url(#clip-india)\"><rect class=\"sea\" width=\"600\" height=\"400\"/><path class=\"grat\" d=\"M41.9,423.5L41.9,-23.5\"/><path class=\"grat\" d=\"M96.8,423.5L96.8,-23.5\"/><path class=\"grat\" d=\"M151.7,423.5L151.7,-23.5\"/><path class=\"grat\" d=\"M206.6,423.5L206.6,-23.5\"/><path class=\"grat\" d=\"M261.6,423.5L261.6,-23.5\"/><path class=\"grat\" d=\"M316.5,423.5L316.5,-23.5\"/><path class=\"grat\" d=\"M371.4,423.5L371.4,-23.5\"/><path class=\"grat\" d=\"M426.3,423.5L426.3,-23.5\"/><path class=\"grat\" d=\"M481.2,423.5L481.2,-23.5\"/><path class=\"grat\" d=\"M536.1,423.5L536.1,-23.5\"/><path class=\"grat eq\" d=\"M52.9,447.1L547.1,447.1\"/><path class=\"grat\" d=\"M52.9,388.2L547.1,388.2\"/><path class=\"grat\" d=\"M52.9,329.4L547.1,329.4\"/><path class=\"grat\" d=\"M52.9,270.6L547.1,270.6\"/><path class=\"grat\" d=\"M52.9,211.8L547.1,211.8\"/><path class=\"grat\" d=\"M52.9,152.9L547.1,152.9\"/><path class=\"grat\" d=\"M52.9,94.1L547.1,94.1\"/><path cla st's scene of Olmec colossal heads. The real heads were carved from basalt boulders dragged about 50 miles from the mountains, and some are about 11 feet tall."},{"img":"aztec-hero","cap":"Artist's scene of Tenochtitlan. The Great Temple had TWO shrines on top: red for Huitzilopochtli, god of war and the sun, and blue for Tlaloc, god of rain."},{"img":"inca-hero","cap":"Artist's scene of an Inca mountain city like Machu Picchu, with farming terraces and llamas."}],"pins":[{"n":"Olmec","lon":-94.04,"lat":18.1,"a":"middle","dy":-14},{"n":"Maya","lon":-89.62,"lat":17.22,"a":"middle","dy":24},{"n":"Aztec","lon":-99.13,"lat":19.43,"a":"end"},{"n":"Inca (Cusco)","lon":-71.97,"lat":-13.53}],"box":[-118,-24,-60,32],"rivers":[],"labels":[{"t":"Andes Mts.","lon":-75.5,"lat":-6.0},{"t":"Gulf of Mexico","lon":-91.5,"lat":24.5},{"t":"Pacific Ocean","lon":-104.0,"lat":5.0}],"hook":"Long before Europeans arrived, the Americas had great civilizations. Meet four of them: the Olmec, Maya, Aztec, and Inca. Each one adapted to a very different landscape.","cards":[{"k":"G","t":"Geography","x":"The Olmec and Maya lived in hot lowlands and rainforests of Mexico and Central America. The Aztec built their capital on an island in Lake Texcoco. The Inca lived high in the Andes Mountains of South America.","f":"The Aztec farmed on the lake with chinampas (floating gardens). The Inca cut terraces into steep mountainsides."},{"k":"R","t":"Religion","x":"All four were polytheistic and worshiped gods of the sun, rain, and corn. They built huge temple pyramids for ceremonies.","f":"The Inca believed their ruler was descended from the sun god, Inti."},{"k":"A","t":"Achievements","x":"Olmec: giant stone heads. Maya: glyph writing, an accurate calendar, astronomy, and the idea of zero. Aztec: chinampas and a city of about 200,000 people. Inca: 25,000 miles of roads, stone walls fitted without mortar, and quipu records.","f":"The Maya figured out the year was about 365 days long."},{"k":"P","t":"Politics","x":"Maya: independent city-states, each with a king. Aztec: an empire ruled by an emperor who collected tribute from conquered peoples. Inca: a huge, organized empire ruled by the Sapa Inca.","f":"Inca runners relayed messages along the roads, up to 150 miles a day."},{"k":"E","t":"Economy","x":"Maize (corn) was the most important crop, with beans and squash. Cacao beans were so valuable the Maya and Aztec used them like money. The Inca had no money; people paid taxes with work.","f":"Chocolate comes from cacao, first enjoyed as a bitter, spicy drink."},{"k":"S","t":"Social","x":"Rulers, nobles, and priests were at the top; then warriors, merchants, and artisans; most people were farmers; enslaved people were at the bottom.","f":"Aztec children, rich and poor, went to school."}],"vocab":[{"t":"Mesoamerica","d":"the region of southern Mexico and Central America"},{"t":"maize","d":"corn, the most important crop of the Americas"},{"t":"glyph","d":"a picture symbol used in Maya writing"},{"t":"chinampa","d":"a floating garden built on a lake"},{"t":"terrace","d":"a flat step cut into a hillside for farming"},{"t":"tribute","d":"payment demanded by a ruler from conquered people"},{"t":"quipu","d":"knotted strings the Inca used to keep records"},{"t":"cacao","d":"the bean used to make chocolate"}],"people":[{"n":"Olmec","d":"The “mother culture” of Mesoamerica (about 1200–400 BCE), famous for colossal stone heads."},{"n":"Maya","d":"Built cities like Tikal and Chichén Itzá; peak about 250–900 CE."},{"n":"Aztec","d":"Founded Tenochtitlan in 1325; conquered by Spain in 1521."},{"n":"Inca","d":"Ruled from Cusco and built Machu Picchu; conquered by Spain in 1532."}],"thenNow":[{"then":"Farmers in Mexico grew the first maize.","now":"Tortillas, popcorn, and cereal all over the world."},{"then":"The Maya and Aztec drank cacao.","now":"Chocolate."},{"then":"Tenochtitlan stood on Lake Texcoco.","now":"Mexico City is built on top of its ruins."},{"then":"Inca roads crossed the Andes.","now":"Hikers walk the Inca Trail to Machu Picchu."}],"timeline":[{"y":-1200,"e":"Olmec culture"},{"y":250,"e":"Maya classic age"},{"y":1325,"e":"Tenochtitlan founded"},{"y":1438,"e":"Inca Empire expands"},{"y":1521,"e":"Spain conquers the Aztec"}],"move":"Pok-ta-pok! The Maya ballgame used hips, not hands. Bounce an imaginary ball off your hip 10 times, then jump to score through the stone ring.","quiz":[{"q":"Which crop was most important in Mesoamerica?","c":["Wheat","Rice","Maize (corn)","Potatoes"],"a":2,"w":"Maize was grown with beans and squash."},{"q":"The Olmec are famous for…","c":["giant stone heads","floating gardens","knotted strings","a long wall"],"a":0,"w":"Some heads are 11 feet tall."},{"q":"The Aztec farmed on a lake using…","c":["terraces","chinampas","irrigation canals only","greenhouses"],"a":1,"w":"Chinampas were floating gardens."},{"q":"The Inca lived in which mountains?","c":["Andes","Alps","Himalayas","Appalachians"],"a":0,"w":"The Andes run along western South America."},{"q":"The Maya wrote using…","c":["cuneiform","glyphs","the alphabet","quipu"],"a":1,"w":"Glyphs are picture symbols."},{"q":"Quipu were…","c":["knotted strings for keeping records","temple pyramids","floating gardens","stone heads"],"a":0,"w":"The Inca used them to track taxes and population."},{"q":"Cacao beans were used…","c":["as money and for a chocolate drink","to build houses","as boats","for writing"],"a":0,"w":"They were very valuable."},{"q":"Which city is built on top of Tenochtitlan?","c":["Lima","Mexico City","Cusco","Los Angeles"],"a":1,"w":"The lake was drained over time."}],"aap":{"t":"Adapt or fail","p":"Compare how the Aztec and the Inca changed their land to grow food. Which was more impressive, and why? Use evidence.","h":["What was the Aztec landscape? What did they build?","What was the Inca landscape? What did they build?","Which took more work or solved a harder problem?"],"m":"The Aztec built chinampas, floating gardens on a lake, which turned water into farmland. The Inca carved terraces into steep mountains, which stopped soil from washing away and made flat fields. I think terraces were more impressive because the Inca moved tons of stone and soil by hand on dangerous slopes, and many terraces are still used today."},"mapSvg":"<svg class=\"rmap\" viewBox=\"0 0 600 400\" role=\"img\" aria-label=\"Map of Mexico, Central & South America\"><defs><clipPath id=\"clip-meso\"><rect width=\"600\" height=\"400\" rx=\"12\"/></clipPath></defs><g clip-path=\"url(#clip-meso)\"><rect class=\"sea\" width=\"600\" height=\"400\"/><path class=\"grat\" d=\"M79.1,414.3L79.1,-14.3\"/><path class=\"grat\" d=\"M114.7,414.3L114.7,-14.3\"/><path class=\"grat\" d=\"M150.4,414.3L150.4,-14.3\"/><path class=\"grat\" d=\"M186.0,414.3L186.0,-14.3\"/><path class=\"grat\" d=\"M221.6,414.3L221.6,-14.3\"/><path class=\"grat\" d=\"M257.2,414.3L257.2,-14.3\"/><path class=\"grat\" d=\"M292.9,414.3L292.9,-14.3\"/><path class=\"grat\" d=\"M328.5,414.3L328.5,-14.3\"/><path class=\"grat\" d=\"M364.1,414.3L364.1,-14.3\"/><path class=\"grat\" d=\"M399.8,414.3L399.8,-14.3\"/><path class=\"grat\" d=\"M435.4,414.3L435.4,-14.3\"/><path class=\"grat\" d=\"M471.0,414.3L471.0,-14.3\"/><path class=\"grat\" d=\"M506.6,414.3L506.6,-14.3\"/><path class=\"grat\" d=\"M79.1,407.1L520.9,407.1\"/><path class=\"grat\" d=\"M79.1,371.4L520.9,371.4\"/><path class=\"grat\" d=\"M79.1,335.7L520.9,335.7\"/><path class=\"grat\" d=\"M79.1,300.0L520.9,300.0\"/><path class=\"grat\" d=\"M79.1,264.3L520.9,264.3\"/><path class=\"grat eq\" d=\"M79.1,228.6L520.9,228.6\"/><path class=\"grat\" d=\"M79.1,192.9L520.9,192.9\"/><path class=\"grat\" d=\"M79.1,157.1L520.9,157.1\"/><path class=\"grat\" d=\"M79.1,121.4L520.9,121.4\"/><path class=\"grat\" d=\"M79.1,85.7L520.9,85.7\"/><path class=\"grat\" d=\"M79.1,50.0L520.9,50.0\"/><path class=\"grat\" d=\"M79.1,14.3L520.9,14.3\"/><path class=\"grat\" d=\"M79.1,-21.4L520.9,-21.4\"/><path class=\"land\" d=\"M892.1,-27.1L920.6,-22.1 an Sea","lon":18.4,"lat":38.0},{"t":"Mt. Olympus","lon":22.36,"lat":40.4,"a":"end"}],"hook":"Greece is a land of mountains and islands, which split people into hundreds of independent city-states. In one of them, Athens, citizens tried something brand new: ruling themselves. They called it democracy.","cards":[{"k":"G","t":"Geography","x":"Mountains cover most of Greece, and no place is far from the sea. Mountains divided people into separate city-states, and the sea made Greeks expert sailors and traders.","f":"Rocky soil was better for olives and grapes than wheat, so Greeks traded for grain."},{"k":"R","t":"Religion","x":"Greeks were polytheistic. Myths told stories of gods on Mount Olympus, like Zeus (king of the gods), Athena (wisdom), and Poseidon (the sea). The Parthenon was a temple for Athena.","f":"The Olympic Games began in 776 BCE to honor Zeus."},{"k":"A","t":"Achievements","x":"Democracy, the Olympics, theater (comedy and tragedy), philosophy (Socrates, Plato, Aristotle), columns in architecture, and math (Pythagoras, Euclid).","f":"The word “democracy” comes from Greek words meaning “people” and “rule.”"},{"k":"P","t":"Politics","x":"Each city-state, or polis, had its own government. Athens had a direct democracy: citizens voted on laws themselves. Sparta was ruled by two kings and a council and focused on its army.","f":"In the U.S., we elect representatives to vote for us. That is a representative democracy."},{"k":"E","t":"Economy","x":"Greeks traded by sea: olive oil, wine, and pottery went out; grain, timber, and metals came in. Coins made trade easier.","f":"Athens' silver coins showed an owl, the symbol of Athena."},{"k":"S","t":"Social","x":"Citizens were free men born in the city. Women could not vote, and many people were enslaved. In Sparta, boys began training as soldiers at age 7.","f":"Spartan girls also trained in sports, which was unusual in Greece."}],"vocab":[{"t":"polis","d":"a Greek city-state"},{"t":"democracy","d":"government by the people"},{"t":"direct democracy","d":"citizens vote on each law themselves"},{"t":"citizen","d":"a member of a city or country with the right to take part in government"},{"t":"myth","d":"a traditional story about gods and heroes"},{"t":"acropolis","d":"a high, rocky hill with temples above a Greek city"},{"t":"agora","d":"an open marketplace and meeting place"},{"t":"philosophy","d":"the study of big questions about life and knowledge"}],"people":[{"n":"Pericles","d":"Leader of Athens during its golden age; built the Parthenon."},{"n":"Socrates","d":"Philosopher who taught by asking questions."},{"n":"Homer","d":"Poet of the Iliad and the Odyssey."},{"n":"Alexander the Great","d":"Spread Greek culture from Egypt to India (336–323 BCE)."}],"thenNow":[{"then":"Athenian citizens voted in the Assembly.","now":"Americans vote in elections."},{"then":"The first Olympic Games, 776 BCE.","now":"The modern Olympics every 4 years."},{"then":"Temples with tall stone columns.","now":"The U.S. Supreme Court and Lincoln Memorial use Greek columns."},{"then":"Greek plays: comedy and tragedy.","now":"Movies, plays, and TV shows."}],"timeline":[{"y":-776,"e":"First Olympic Games"},{"y":-508,"e":"Democracy in Athens"},{"y":-447,"e":"Parthenon begun"},{"y":-336,"e":"Alexander the Great"}],"move":"Olympic Warm-up: 10 jumping jacks, sprint in place for 10 seconds, then throw an imaginary discus 5 times.","quiz":[{"q":"Why did Greece develop separate city-states?","c":["Mountains divided the land","A king ordered it","Rivers flooded","Everyone spoke different languages"],"a":0,"w":"Geography shaped politics."},{"q":"Athens had a…","c":["monarchy","direct democracy","dictatorship","empire"],"a":1,"w":"Citizens voted on laws themselves."},{"q":"Sparta focused on…","c":["art","the military","sailing only","philosophy"],"a":1,"w":"Spartan boys trained as soldiers from age 7."},{"q":"The Parthenon was a temple for…","c":["Zeus","Poseidon","Athena","Apollo"],"a":2,"w":"Athena was the goddess of wisdom and protector of Athens."},{"q":"Greek myths are…","c":["laws","stories about gods and heroes","maps","coins"],"a":1,"w":"They explained nature and taught lessons."},{"q":"Who could vote in Athens?","c":["Everyone","Free men born in Athens","Only women","Only the king"],"a":1,"w":"Women, enslaved people, and foreigners could not."},{"q":"Which modern building uses Greek columns?","c":["A skyscraper","The U.S. Supreme Court","An igloo","A barn"],"a":1,"w":"Many government buildings copy Greek style."},{"q":"Because Greece is surrounded by sea, Greeks became…","c":["desert nomads","sailors and traders","rice farmers","mountain hermits"],"a":1,"w":"The sea connected Greece to other lands."}],"aap":{"t":"Was Athens a true democracy?","p":"Use evidence about who could and could not vote in Athens. Was it a true democracy? Compare it with the United States today.","h":["Who COULD vote in Athens?","Who could NOT vote?","Who can vote in the U.S. today?"],"m":"Athens invented the idea of citizens voting on laws, which was a huge step. But only free men born in Athens could vote, so women, enslaved people, and foreigners, who were most of the people, had no voice. The United States today lets all citizens 18 and older vote, so the idea of democracy grew to include more people over time."},"mapSvg":"<svg class=\"rmap\" viewBox=\"0 0 600 400\" role=\"img\" aria-label=\"Map of Southern Europe\"><defs><clipPath id=\"clip-greece\"><rect width=\"600\" height=\"400\" rx=\"12\"/></clipPath></defs><g clip-path=\"url(#clip-greece)\"><rect class=\"sea\" width=\"600\" height=\"400\"/><path class=\"grat\" d=\"M-15.2,466.7L-15.2,-66.7\"/><path class=\"grat\" d=\"M116.1,466.7L116.1,-66.7\"/><path class=\"grat\" d=\"M247.5,466.7L247.5,-66.7\"/><path class=\"grat\" d=\"M378.8,466.7L378.8,-66.7\"/><path class=\"grat\" d=\"M510.1,466.7L510.1,-66.7\"/><path class=\"grat\" d=\"M641.5,466.7L641.5,-66.7\"/><path class=\"grat\" d=\"M-15.2,466.7L615.2,466.7\"/><path class=\"grat\" d=\"M
