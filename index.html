<path class=\"n\" d=\"M0,-18L5,0L-5,0Z\"/><text y=\"-22\" text-anchor=\"middle\">N</text></g></svg>","guide":"greece-guide"},{"id":"rome","unit":"Unit 4","q":"Q2","title":"Ancient Rome","short":"Rome","years":"509 BCE–476 CE","region":"Southern Europe (Italy)","stamp":"stamp-rome","hero":"rome-hero","heroCap":"Artist's scene of the Roman Forum, with an aqueduct in the distance.","pins":[{"n":"Rome","lon":12.49,"lat":41.89}],"box":[-10,28,42,50],"rivers":["tiber"],"labels":[{"t":"Italy","lon":15.0,"lat":41.0},{"t":"Mediterranean Sea","lon":17.0,"lat":34.0},{"t":"Alps","lon":9.0,"lat":46.5}],"hook":"Rome started as a small town on seven hills beside the Tiber River. It grew into an empire that circled the whole Mediterranean Sea. Its roads, laws, and government ideas still shape our world.","cards":[{"k":"G","t":"Geography","x":"Rome sat in the middle of the Italian peninsula, which juts into the middle of the Mediterranean Sea. The Tiber River gave water and trade, the Alps helped protect the north, and flat plains were good for farming.","f":"Romans called the Mediterranean “Mare Nostrum,” meaning “Our Sea.”"},{"k":"R","t":"Religion","x":"Romans were polytheistic and borrowed many Greek gods with new names: Zeus became Jupiter. Christianity began in the Roman Empire with the teachings of Jesus. Christians were persecuted at first, but Emperor Constantine allowed Christianity in 313 CE, and later it became the official religion.","f":"Christianity spread quickly along Roman roads and sea routes."},{"k":"A","t":"Achievements","x":"Paved roads, aqueducts (bridges that carried water), arches, domes, concrete, the Colosseum, the Latin alphabet, and a calendar with 365 days.","f":"About 50,000 miles of paved roads linked the empire. “All roads lead to Rome!”"},{"k":"P","t":"Politics","x":"Republic (509 to 27 BCE): citizens elected representatives, two consuls led, and the Senate advised. Laws were written on the Twelve Tables. Empire (27 BCE to 476 CE): one emperor ruled, starting with Augustus.","f":"A republic is a government where citizens elect representatives, like the United States."},{"k":"E","t":"Economy","x":"Trade crossed the Mediterranean: grain from Egypt, olive oil, wine, and metals moved by road and ship. One coin system across the empire made trade easy.","f":"Rome imported so much grain that the government gave free bread to poor citizens."},{"k":"S","t":"Social","x":"Patricians were wealthy landowning families. Plebeians were common people, who fought for and won more rights. Many enslaved people did the hardest work.","f":"Plebeians won the right to elect their own leaders, called tribunes."}],"vocab":[{"t":"republic","d":"government where citizens elect representatives"},{"t":"Senate","d":"a group of leaders who advised and made laws in Rome"},{"t":"patrician","d":"a wealthy, landowning Roman"},{"t":"plebeian","d":"a common Roman citizen"},{"t":"emperor","d":"a ruler of an empire with total power"},{"t":"aqueduct","d":"a bridge-like channel that carries water"},{"t":"peninsula","d":"land surrounded by water on three sides"},{"t":"Christianity","d":"a religion based on the teachings of Jesus"}],"people":[{"n":"Julius Caesar","d":"General who took control of Rome; assassinated in 44 BCE."},{"n":"Augustus","d":"First emperor; began the Pax Romana, about 200 years of peace."},{"n":"Constantine","d":"First Christian emperor; legalized Christianity in 313 CE."},{"n":"The Colosseum","d":"Giant arena that held about 50,000 people."}],"thenNow":[{"then":"The Roman Republic had a Senate of elected leaders.","now":"The U.S. has a Senate and elected representatives."},{"then":"Romans spoke Latin.","now":"Spanish, Italian, and French come from Latin, plus many English words."},{"then":"Aqueducts and arches carried water and held up buildings.","now":"Bridges and domes, like the U.S. Capitol dome."},{"then":"Christianity spread across the empire.","now":"It is the world's largest religion today."}],"timeline":[{"y":-509,"e":"Roman Republic begins"},{"y":-44,"e":"Julius Caesar killed"},{"y":-27,"e":"Augustus becomes emperor"},{"y":313,"e":"Christianity allowed"},{"y":476,"e":"Western Empire falls"}],"move":"Legion March: march in place like a Roman soldier for 20 seconds, shield up! Then make an arch with your arms over your head and hold for 10 seconds.","quiz":[{"q":"Rome is on which peninsula?","c":["Arabian","Italian","Iberian","Korean"],"a":1,"w":"It sits in the middle of the Mediterranean."},{"q":"In a republic, citizens…","c":["obey a king","elect representatives","have no rights","vote on every law"],"a":1,"w":"The U.S. is also a republic."},{"q":"The Roman name for Zeus was…","c":["Mars","Neptune","Jupiter","Apollo"],"a":2,"w":"Romans borrowed many Greek gods."},{"q":"Aqueducts carried…","c":["water","soldiers","grain","letters"],"a":0,"w":"They brought fresh water to cities."},{"q":"Who was the first Roman emperor?","c":["Julius Caesar","Augustus","Constantine","Nero"],"a":1,"w":"Caesar was never officially emperor."},{"q":"Which emperor allowed Christianity?","c":["Augustus","Constantine","Caesar","Hannibal"],"a":1,"w":"He legalized it in 313 CE."},{"q":"Patricians were…","c":["enslaved people","wealthy landowners","soldiers","farmers"],"a":1,"w":"Plebeians were the common people."},{"q":"Which language came from Latin?","c":["Chinese","Spanish","Arabic","Hindi"],"a":1,"w":"Spanish, Italian, French, Portuguese, and Romanian all come from Latin."}],"aap":{"t":"From republic to empire","p":"Why do you think Romans traded their republic for an emperor? What did they gain and what did they lose? Then explain how this connects to the checks and balances in the U.S. Constitution.","h":["What problems did Rome have before Augustus?","What did one strong ruler bring?","What power did citizens lose?"],"m":"After many civil wars, Romans wanted peace and order, so they accepted Augustus as emperor, and they got about 200 years of peace. But they lost their voice in government, because one person held all the power. The U.S. Founders studied Rome and created checks and balances so no single person could take over."},"mapSvg":"<svg class=\"rmap\" viewBox=\"0 0 600 400\" role=\"img\" aria-label=\"Map of Southern Europe (Italy)\"><defs><clipPath id=\"clip-rome\"><rect width=\"600\" height=\"400\" rx=\"12\"/></clipPath></defs><g clip-path=\"url(#clip-rome)\"><rect class=\"sea\" width=\"600\" height=\"400\"/><path class=\"grat\" d=\"M0.0,393.0L0.0,7.0\"/><path class=\"grat\" d=\"M57.7,393.0L57.7,7.0\"/><path class=\"grat\" d=\"M115.4,393.0L115.4,7.0\"/><path class=\"grat\" d=\"M173.1,393.0L173.1,7.0\"/><path class=\"grat\" d=\"M230.8,393.0L230.8,7.0\"/><path class=\"grat\" d=\"M288.5,393.0L288.5,7.0\"/><path class=\"grat\" d=\"M346.2,393.0L346.2,7.0\"/><path class=\"grat\" d=\"M403.8,393.0L403.8,7.0\"/><path class=\"grat\" d=\"M461.5,393.0L461.5,7.0\"/><path class=\"grat\" d=\"M519.2,393.0L519.2,7.0\"/><path class=\"grat\" d=\"M576.9,393.0L576.9,7.0\"/><path class=\"grat\" d=\"M634.6,393.0L634.6,7.0\"/><path class=\"grat\" d=\"M-23.1,407.9L623.1,407.9\"/><path class=\"grat\" d=\"M-23.1,333.6L623.1,333.6\"/><path class=\"grat\" d=\"M-23.1,259.4L623.1,259.4\"/><path class=\"grat\" d=\"M-23.1,185.2L623.1,185.2\"/><path class=\"grat\" d=\"M-23.1,110.9L623.1,110.9\"/><path class=\"grat\" d=\"M-23.1,36.7L623.1,36.7\"/><path class=\"land\" d=\"M47.3,247.5L93.5,257.9L150.0,232.7L214.6,231.2L233.1,226.7L243.5,231.2L236.5,247.5L243.5,256.4L231.9,271.3L248.1,286.1L267.7,290.6L290.8,299.5L306.9,315.8L325.4,324.7L341.5,327.7L347.3,302.4L375.0,292.1L392.3,302.4L406.2,309.9L450.0,320.3L460.4,315.8L473.1,309.9L488.1,314.3L491.5,335.1L491.5,348.5L506.5,382.6L525.0,424.2L540.0,452.4L544.6,488.0L560.8,511.8L571.2,547.4L590.8,566.7L608.1,586.0L612.7,606.8L623.1,624.6L634.6,624.6L663.5,614.2L707.3,603.8L705.0,624.6L696.9,660.3L675.0,700.4L657.7,725.6L638.1,749.3L617.3,770.1L605.8,785.0L587.3,813.2L573.5,839.9L568.8,880.0L572.3,905.2L582.7,934.9L583.8,994.3L585.0,1001.8L565.4,1 vg>","guide":"rome-guide"},{"id":"africa","unit":"Unit 5","q":"Q2","title":"Axum & Great Zimbabwe","short":"Africa","years":"100–1450 CE","region":"Eastern & Southern Africa","stamp":"stamp-africa","hero":"zimbabwe-hero","heroCap":"Artist's scene of Great Zimbabwe: huge curved granite walls and a cone-shaped tower, built without mortar.","extra":{"img":"axum-hero","cap":"Artist's scene of an Axum market. Look closer: real Axum stelae are flat-sided towers carved with fake doors and windows, not Egyptian-style obelisks."},"pins":[{"n":"Axum","lon":38.72,"lat":14.13},{"n":"Great Zimbabwe","lon":30.93,"lat":-20.27}],"box":[8,-32,58,24],"rivers":["nile","zambezi","limpopo"],"labels":[{"t":"Red Sea","lon":38.5,"lat":20.5},{"t":"Indian Ocean","lon":50.0,"lat":-12.0},{"t":"Zambezi R.","lon":24.5,"lat":-15.4},{"t":"Limpopo R.","lon":29.5,"lat":-24.4},{"t":"Ethiopian Highlands","lon":36.0,"lat":10.5}],"hook":"Two African kingdoms grew rich by trade. Axum linked Africa to the Red Sea and the Indian Ocean. Great Zimbabwe traded gold so far that Chinese porcelain ended up inside its walls.","cards":[{"k":"G","t":"Geography","x":"Axum sat in the Ethiopian Highlands near the Red Sea, with cooler weather and rain for farming. Great Zimbabwe was on a high plateau between the Zambezi and Limpopo rivers, with grassland for cattle and gold nearby.","f":"Both kingdoms were close enough to the Indian Ocean to join huge sea-trade networks."},{"k":"R","t":"Religion","x":"Axum's King Ezana became Christian about 330 CE, making Axum one of the first Christian kingdoms. Great Zimbabwe's people honored their ancestors and a creator god.","f":"Eight carved soapstone birds were found at Great Zimbabwe. One is on Zimbabwe's flag today."},{"k":"A","t":"Achievements","x":"Axum: giant carved granite stelae, its own gold, silver, and bronze coins, and Ge'ez, a written language. Great Zimbabwe: massive stone walls built without mortar, some about 36 feet tall.","f":"The tallest Axum stela, now fallen, was about 108 feet long."},{"k":"P","t":"Politics","x":"Axum's kings controlled trade on the Red Sea. Great Zimbabwe's rulers lived on a hilltop and controlled the gold and cattle trade.","f":"“Zimbabwe” means “great stone houses” in the Shona language."},{"k":"E","t":"Economy","x":"Axum traded ivory, gold, and incense for cloth, glass, and spices through its port, Adulis. Great Zimbabwe traded gold and ivory with Swahili coast cities for cloth, glass beads, and porcelain from China and Persia.","f":"Chinese porcelain found at Great Zimbabwe proves trade reached across the Indian Ocean."},{"k":"S","t":"Social","x":"Kings and nobles were at the top, then traders, then farmers, cattle herders, and artisans. At Great Zimbabwe, owning cattle was a sign of wealth.","f":"Around 18,000 people may have lived at Great Zimbabwe at its peak."}],"vocab":[{"t":"plateau","d":"high, flat land"},{"t":"stela","d":"a tall carved stone monument (plural: stelae)"},{"t":"mortar","d":"a paste used to hold stones or bricks together"},{"t":"trade network","d":"connected routes where goods are bought and sold"},{"t":"ivory","d":"hard white material from elephant tusks"},{"t":"incense","d":"material burned for a sweet smell, used in worship"},{"t":"Ge'ez","d":"the written language of Axum"},{"t":"port","d":"a town where ships load and unload goods"}],"people":[{"n":"King Ezana","d":"Axum king who adopted Christianity about 330 CE."},{"n":"Adulis","d":"Axum's busy port on the Red Sea."},{"n":"Great Enclosure","d":"The largest ancient stone structure south of the Sahara."},{"n":"Zimbabwe Birds","d":"Soapstone carvings that are now a national symbol."}],"thenNow":[{"then":"Axum became a Christian kingdom.","now":"The Ethiopian Orthodox Church still uses Ge'ez in worship."},{"then":"Axum wrote in the Ge'ez script.","now":"Amharic, a language of Ethiopia, uses a script that grew from Ge'ez."},{"then":"The kingdom of Great Zimbabwe.","now":"The country Zimbabwe took its name from the ruins in 1980."},{"then":"Gold traded for goods from across the ocean.","now":"Global trade connects every continent."}],"timeline":[{"y":100,"e":"Axum grows powerful"},{"y":330,"e":"King Ezana becomes Christian"},{"y":1100,"e":"Great Zimbabwe built"},{"y":1450,"e":"Great Zimbabwe abandoned"}],"move":"Stone Stacker: squat, lift an imaginary granite block, and stack it high. Do 10 blocks. No mortar, so balance carefully!","quiz":[{"q":"Axum controlled trade on the…","c":["Red Sea","Caspian Sea","Atlantic Ocean","Lake Victoria"],"a":0,"w":"Its port, Adulis, was on the Red Sea."},{"q":"Great Zimbabwe's walls were built…","c":["with cement","without mortar","from wood","from mud brick"],"a":1,"w":"Stones were carefully fitted together."},{"q":"What did Great Zimbabwe trade most?","c":["Silk","Gold and ivory","Paper","Olive oil"],"a":1,"w":"Gold came from nearby mines."},{"q":"King Ezana of Axum adopted…","c":["Islam","Christianity","Buddhism","Confucianism"],"a":1,"w":"About 330 CE."},{"q":"Which find proves Great Zimbabwe traded with China?","c":["Porcelain","Snow","Rice paddies","Pyramids"],"a":0,"w":"Pieces of Chinese porcelain were found there."},{"q":"Axum's tall carved stones are called…","c":["ziggurats","stelae","stupas","aqueducts"],"a":1,"w":"They marked royal tombs."},{"q":"“Zimbabwe” means…","c":["river of gold","great stone houses","land of kings","mountain home"],"a":1,"w":"It comes from the Shona language."},{"q":"Axum made its own…","c":["coins","paper","silk","pyramids"],"a":0,"w":"Gold, silver, and bronze coins helped trade."}],"aap":{"t":"Trade changes everything","p":"Using evidence, explain how trade made BOTH kingdoms rich AND brought new ideas.","h":["What did each kingdom trade away? What did it get?","What evidence shows how far trade reached?","What idea or belief arrived through trade?"],"m":"Axum's spot on the Red Sea let it trade ivory and gold for cloth and spices, and traders also brought Christianity, which King Ezana adopted. Great Zimbabwe traded on caravan trade routes.","f":"The region sits where Asia, Africa, and Europe meet, a perfect crossroads for trade."},{"k":"R","t":"Religion","x":"Islam began with Muhammad in Mecca around 610 CE. Muslims believe in one God (Allah) and follow the Qur'an, their holy book. The Five Pillars are faith, prayer, charity, fasting during Ramadan, and pilgrimage (Hajj) to Mecca.","f":"Judaism, Christianity, and Islam all trace their roots to Abraham."},{"k":"A","t":"Achievements","x":"Algebra (from the scholar al-Khwarizmi), a better astrolabe, hospitals, medical books, paper mills, spreading Hindu-Arabic numerals, and beautiful geometric art and calligraphy.","f":"The word “algebra” comes from the Arabic word “al-jabr.”"},{"k":"P","t":"Politics","x":"After Muhammad died in 632 CE, leaders called caliphs ruled. The Umayyad and then the Abbasid caliphates built huge empires. The Abbasids founded Baghdad as their capital in 762 CE.","f":"Baghdad was built as a perfectly round city."},{"k":"E","t":"Economy","x":"Caravan and sea trade linked China, India, Africa, and Europe: spices, silk, paper, textiles, and metalwork filled markets called souks.","f":"Muslim traders learned papermaking from China and built paper mills in Baghdad."},{"k":"S","t":"Social","x":"Merchants and scholars were respected. Muslims, Christians, and Jews lived together in many cities. Society included rulers, merchants, farmers, and enslaved people.","f":"Scholars of many faiths worked side by side at the House of Wisdom."}],"vocab":[{"t":"nomad","d":"a person who moves from place to place"},{"t":"oasis","d":"a place in the desert with water and plants"},{"t":"Islam","d":"a religion based on belief in one God and the teachings of Muhammad"},{"t":"Qur'an","d":"the holy book of Islam"},{"t":"mosque","d":"a Muslim place of worship"},{"t":"caliph","d":"a ruler of the Muslim community after Muhammad"},{"t":"calligraphy","d":"the art of beautiful handwriting"},{"t":"astrolabe","d":"a tool for measuring the stars to find time and direction"}],"people":[{"n":"Muhammad","d":"The prophet of Islam, born in Mecca about 570 CE."},{"n":"al-Khwarizmi","d":"Mathematician called the “father of algebra.”"},{"n":"House of Wisdom","d":"A library and research center in Baghdad."},{"n":"Mecca","d":"Islam's holiest city and the site of the Hajj."}],"thenNow":[{"then":"Al-Khwarizmi wrote about algebra.","now":"Students study algebra in middle and high school."},{"then":"Muslim traders spread Hindu-Arabic numerals.","now":"The digits 0 to 9 you use every day."},{"then":"Early hospitals and medical books.","now":"Modern hospitals and medicine."},{"then":"Geometric patterns in tiles and buildings.","now":"Pattern design in art, tiles, and fabric."}],"timeline":[{"y":610,"e":"Islam begins"},{"y":622,"e":"Journey to Medina (Hijra)"},{"y":632,"e":"Caliphs begin to rule"},{"y":762,"e":"Baghdad founded"},{"y":830,"e":"House of Wisdom thrives"}],"move":"Caravan Crossing: walk slowly like a camel for 15 seconds, shade your eyes to spot an oasis, then jump in!","quiz":[{"q":"Most of the Arabian Peninsula is…","c":["rainforest","desert","tundra","grassland"],"a":1,"w":"Few rivers and little rain."},{"q":"Islam began in the city of…","c":["Baghdad","Mecca","Rome","Cairo"],"a":1,"w":"Muhammad began preaching in Mecca around 610 CE."},{"q":"The holy book of Islam is…","c":["the Qur'an","the Analects","the Iliad","the Twelve Tables"],"a":0,"w":"Muslims believe it contains God's words."},{"q":"The Hajj is…","c":["a type of tent","a pilgrimage to Mecca","a desert storm","a trade good"],"a":1,"w":"It is one of the Five Pillars."},{"q":"Baghdad's House of Wisdom was…","c":["a palace for the caliph","a library and center for scholars","a mosque","a market"],"a":1,"w":"Scholars translated and built on books from many cultures."},{"q":"The word “algebra” comes from…","c":["Latin","Greek","Arabic","Chinese"],"a":2,"w":"From “al-jabr.”"},{"q":"An oasis is…","c":["a desert place with water","a mountain","a ship","a law"],"a":0,"w":"Towns grew up around oases."},{"q":"Why was this region great for trade?","c":["It was isolated","It sits where Asia, Africa, and Europe meet","It had no deserts","It was covered in ice"],"a":1,"w":"It was a crossroads of three continents."}],"aap":{"t":"Crossroads of ideas","p":"Explain how the location of Southwest Asia helped Islamic scholars make discoveries. Use one specific example.","h":["Where is Baghdad compared to Greece, Persia, and India?","What did scholars at the House of Wisdom do with books?","Name one discovery that built on another culture's idea."],"m":"Because Baghdad was at a crossroads, scholars could gather books from Greece, Persia, and India. At the House of Wisdom they translated them into Arabic and built on them. For example, al-Khwarizmi used Indian numbers to develop algebra. Location brought ideas together, and mixing ideas led to new ones."},"mapSvg":"<svg class=\"rmap\" viewBox=\"0 0 600 400\" role=\"img\" aria-label=\"Map of Southwest Asia (Middle East)\"><defs><clipPath id=\"clip-swasia\"><rect width=\"600\" height=\"400\" rx=\"12\"/></clipPath></defs><g clip-path=\"url(#clip-swasia)\"><rect class=\"sea\" width=\"600\" height=\"400\"/><path class=\"grat\" d=\"M30.4,425.0L30.4,-25.0\"/><path class=\"grat\" d=\"M86.5,425.0L86.5,-25.0\"/><path class=\"grat\" d=\"M142.7,425.0L142.7,-25.0\"/><path class=\"grat\" d=\"M198.9,425.0L198.9,-25.0\"/><path class=\"grat\" d=\"M255.1,425.0L255.1,-25.0\"/><path class=\"grat\" d=\"M311.2,425.0L311.2,-25.0\"/><path class=\"grat\" d=\"M367.4,425.0L367.4,-25.0\"/><path class=\"grat\" d=\"M423.6,425.0L423.6,-25.0\"/><path class=\"grat\" d=\"M479.8,425.0L479.8,-25.0\"/><path class=\"grat\" d=\"M535.9,425.0L535.9,-25.0\"/><path class=\"grat\" d=\"M52.8,400.0L547.2,400.0\"/><path class=\"grat\" d=\"M52.8,337.5L547.2,337.5\"/><path class=\"grat\" d=\"M52.8,275.0L547.2,275.0\"/><path class=\"grat\" d=\"M52.8,212.5L547.2,212.5\"/><path class=\"grat\" d=\"M52.8,150.0L547.2,150.0\"/><path cl e an essential question, like “How did Roman roads change travel?”","f":"A good essential question can't be answered with yes, no, or one word."},{"k":"2","t":"Find","x":"Look for sources: library books, encyclopedias, museum websites (.edu, .gov, .org), maps, and pictures of artifacts.","f":"A primary source was made at the time (a coin, a letter). A secondary source was written later about it (a textbook)."},{"k":"3","t":"Check","x":"Evaluate each source: Who made it? When? Is it trying to inform or persuade? Do other sources agree?","f":"If two good sources disagree, look for a third."},{"k":"4","t":"Note","x":"Write facts in your own words and record where each fact came from: title, author, and website.","f":"Copying someone's words without credit is plagiarism."},{"k":"5","t":"Make","x":"Create your product: a report, poster, slideshow, or model. Write to describe, inform, explain, or persuade.","f":"Start with a strong claim, then back it up with evidence."},{"k":"6","t":"Share","x":"Present to your group, listen to feedback, and answer questions.","f":"Practice out loud once before you present."}],"vocab":[{"t":"essential question","d":"a big, open question that needs research to answer"},{"t":"primary source","d":"something made at the time of the event"},{"t":"secondary source","d":"something made later about an event"},{"t":"citation","d":"a note that tells where information came from"},{"t":"paraphrase","d":"to put someone's ideas into your own words"},{"t":"bias","d":"a one-sided view that favors one side"},{"t":"evidence","d":"facts that support a claim"},{"t":"collaborate","d":"to work together toward a shared goal"}],"peopleTitle":"Topic ideas","people":[{"n":"Roman engineering","d":"How did roads and aqueducts change daily life?"},{"n":"Chinese inventions","d":"Which Chinese invention changed the world most?"},{"n":"Maya astronomy","d":"How did the Maya calendar guide farming and ceremonies?"},{"n":"Great Zimbabwe trade","d":"What does porcelain at Great Zimbabwe tell us?"},{"n":"Islamic science","d":"How did the House of Wisdom preserve and grow knowledge?"},{"n":"Greek democracy","d":"How does Athens still affect how we vote?"}],"thenNow":[{"then":"Scribes copied books by hand, one at a time.","now":"You can search millions of sources in seconds."},{"then":"Historians compared stories from travelers.","now":"You compare sources to check facts."}],"timeline":[],"move":"Brain Recharge: take 5 slow breaths, roll your shoulders 5 times, then do 10 wall push-ups before your next research block.","quiz":[{"q":"A primary source is…","c":["made at the time of the event","written much later","always a website","a guess"],"a":0,"w":"Coins, letters, and artifacts are primary sources."},{"q":"Which is a primary source?","c":["A textbook chapter","An ancient Roman coin","A video made last year about Rome","An encyclopedia article"],"a":1,"w":"The coin was made by Romans at the time."},{"q":"To paraphrase means to…","c":["copy word for word","put it in your own words","delete it","draw a picture"],"a":1,"w":"Then still cite where the idea came from."},{"q":"Why do researchers cite sources?","c":["To make the paper longer","To show where facts came from and give credit","To confuse readers","Because it looks nice"],"a":1,"w":"Citations let readers check your work."},{"q":"Which question helps you evaluate a source?","c":["What color is the cover?","Who made it and why?","Is it long?","Is the font big?"],"a":1,"w":"Purpose and author tell you if it can be trusted."},{"q":"An essential question is…","c":["a yes/no question","a big, open question that needs research","a math problem","a spelling test"],"a":1,"w":"Example: How did Roman roads change travel?"},{"q":"Bias means…","c":["a one-sided view","a true fact","a primary source","a map"],"a":0,"w":"Watch for sources that only tell one side."},{"q":"The best way to work in a group is to…","c":["let one person do everything","agree on roles and listen to every idea","argue until someone quits","work silently alone"],"a":1,"w":"Set group norms first."}],"aap":{"t":"Build your thesis","p":"Write a one-sentence claim answering: Which ancient civilization's contribution matters MOST today? Give 3 pieces of evidence and 1 counterargument.","h":["Make a claim in one sentence.","List 3 facts that support it.","What would someone who disagrees say? Answer them."],"m":"Claim: Ancient India's number system matters most because every computer, phone, and math class uses zero and place value. Evidence: 1) zero lets us write any number with 10 digits, 2) Muslim scholars spread it to Europe, 3) computers run on 0s and 1s. Counterargument: Greek democracy shapes how we govern, but numbers are used by every country in the world, democratic or not."},"mapSvg":null},{"id":"europe","unit":"Unit 7","q":"Q4","title":"Medieval Europe & Renaissance","short":"Europe","years":"500–1600 CE","region":"Western Europe","stamp":"stamp-europe","hero":"europe-hero","heroCap":"Artist's scene: a castle and manor village from the Middle Ages, next to a Renaissance artist's workshop.","pins":[{"n":"Florence","lon":11.25,"lat":43.77,"a":"end","dy":12},{"n":"Venice","lon":12.33,"lat":45.44,"dy":-6},{"n":"Paris","lon":2.35,"lat":48.86},{"n":"Jerusalem","lon":35.21,"lat":31.77}],"box":[-12,28,38,58],"rivers":[],"labels":[{"t":"Mediterranean Sea","lon":17.0,"lat":34.0},{"t":"Atlantic Ocean","lon":-9.0,"lat":44.0},{"t":"Holy Land","lon":36.5,"lat":34.6}],"hook":"After Rome fell, Western Europe broke into small kingdoms. For about 1,000 years, life centered on castles, manors, and the Church. Then trade and new ideas sparked a “rebirth” called the Renaissance.","cards":[{"k":"G","t":"Geography","x":"Western Europe has many rivers, a mild climate, and good farmland. Seas and rivers made trade possible. Italy, in the middle of the Mediterranean, was perfectly placed to trade with Asia and Africa.","f":"Venice was built on 118 small islands in a lagoon."},{"k":"R","t":"Religion","x":"The Roman Catholic Church was the most powerful institution. Monasteries were centers of learning where monks copied books by hand. The Crusades (1096 to 1291) were wars between European Christians and Muslims over the Holy Land.","f":"Huge Gothic cathedrals took 100 years or more to build."},{"k":"A","t":"Achievements","x":"Middle Ages: castles, Gothic cathedrals, the first universities, and the Magna Carta (1215). Renaissance: realistic painting with perspective, Gutenberg's printing press (about 1450), and the art of Leonardo da Vinci and Michelangelo.","f":"The Magna Carta said even the king must obey the law, an idea found in the U.S. Constitution."},{"k":"P","t":"Politics","x":"Feudalism: the king gave land (fiefs) to lords; lords gave land to knights in exchange for military service; knights protected the manor; serfs farmed the land and could not leave it.","f":"Charlemagne united much of Western Europe and was crowned emperor in 800 CE."},{"k":"E","t":"Economy","x":"Manors made almost everything they needed. The Crusades and the Silk Road brought spices, silk, sugar, and new ideas from Asia and the Middle East. Trade made Italian city-states like Florence and Venice rich.","f":"Spices were worth more than gold by weight in parts of medieval Europe."},{"k":"S","t":"Social","x":"The feudal pyramid: king, then nobles and lords, then knights, then peasants and serfs. In the Renaissance, rich merchants and bankers like the Medici family paid artists. These supporters were called patrons.","f":"Renaissance means “rebirth,” a rebirth of interest in Greek and Roman learning."}],"vocab":[{"t":"feudalism","d":"a system where land was traded for loyalty and service"},{"t":"manor","d":"a lord's large estate with a village and farmland"},{"t":"serf","d":"a peasant who farmed a lord's land and could not leave"},{"t":"knight","d":"a mounted soldier who served a lord"},{"t":"Crusades","d":"wars over control of the Holy Land"},{"t":"Renaissance","d":"a “rebirth” of art and learning in Europe"},{"t":"patron","d":"a person who pays an artist to make art"},{"t":"perspective","d":"a painting method that makes flat pictures look 3-D"}],"people":[{"n":"Charlemagne","d":"United much of Western Europe; crowned emperor in 800 CE."},{"n":"Leonardo da Vinci","d":"Renaissance painter of the Mona Lisa, inventor, and scientist."},{"n":"Johannes Gutenberg","d":"Built a movable-type printing press about 1450."},{"n":"The Medici family","d":"Bankers in Florence who were patrons of artists."}],"thenNow":[{"then":"Gutenberg's printing press made books cheaper.","now":"Books, newspapers, and the internet spread ideas fast."},{"then":"The Magna Carta limited the king's power.","now":"No one is above the law, not even a president."},{"then":"The first universities opened.","now":"Colleges and universities everywhere."},{"then":"Crusaders brought back spices and sugar.","now":"Spices and sugar in your kitchen."}],"timeline":[{"y":476,"e":"Rome falls; Middle Ages begin"},{"y":800,"e":"Charlemagne crowned"},{"y":1096,"e":"First Crusade"},{"y":1215,"e":"Magna Carta"},{"y":1450,"e":"Printing press"},{"y":1503,"e":"Mona Lisa painted"}],"move":"Knight Training: 5 sword lunges on each leg, hold your shield (arms out) for 10 seconds, then bow to the king.","quiz":[{"q":"In feudalism, a serf…","c":["ruled the kingdom","farmed a lord's land","led an army","painted pictures"],"a":1,"w":"Serfs could not leave the manor."},{"q":"Knights received land in exchange for…","c":["paintings","military service","taxes only","books"],"a":1,"w":"They protected the lord and manor."},{"q":"The Crusades were…","c":["wars over the Holy Land","a type of castle","a painting style","a trade fair"],"a":0,"w":"They lasted from 1096 to 1291."},{"q":"“Renaissance” means…","c":["darkness","rebirth","castle","journey"],"a":1,"w":"A rebirth of Greek and Roman learning."},{"q":"Who built a movable-type printing press?","c":["Leonardo da Vinci","Charlemagne","Johannes Gutenberg","Michelangelo"],"a":2,"w":"Around 1450."},{"q":"A patron is…","c":["someone who pays artists","a knight's horse","a serf","a church"],"a":0,"w":"The Medici were famous patrons."},{"q":"What helped start the Renaissance in Italy?","c":["Trade made Italian cities rich","Italy had no cities","Everyone moved to farms","Castles were banned"],"a":0,"w":"Wealth from trade paid for art and learning."},{"q":"The Magna Carta said…","c":["the king must obey the law","knights could vote","serfs owned the land","the Church had no power"],"a":0,"w":"This idea is in the U.S. Constitution."}],"aap":{"t":"Did the Crusades fail or succeed?","p":"European armies did not keep the Holy Land, but trade and learning grew. Argue whether the Crusades were a failure or a success, and support your answer with evidence.","h":["What was the military goal? Was it reached?","What goods and ideas came back to Europe?","How did that connect to the Renaissance?"],"m":"Militarily, the Crusades failed, because Europeans lost the Holy Land. But Crusaders brought back spices, sugar, and silk, and contact with Muslim scholars brought Greek books and new math to Europe. That trade and learning helped make Italian cities rich and helped spark the Renaissance, so the long-term effects were huge."},"mapSvg":"<svg class=\"rmap\" viewBox=\"0 0 600 400\" role=\"img\" aria-label=\"Map of Western Europe\"><defs><clipPath id=\"clip-europe\"><rect width=\"600\" height=\"400\" rx=\"12\"/></clipPath></defs><g clip-path=\"url(#clip-europe)\"><rect class=\"sea\" width=\"600\" height=\"400\"/><path class=\"grat\" d=\"M27.0,426.7L27.0,-26.7\"/><path class=\"grat\" d=\"M75.7,426.7L75.7,-26.7\"/><path class=\"grat\" d=\"M124.5,426.7L124.5,-26.7\"/><path class=\"grat\" d=\"M173.2,426.7L173.2,-26.7\"/><path class=\"grat\" d=\"M222.0,426.7L222.0,-26.7\"/><path class=\"grat\" d=\"M270.7,426.7L270.7,-26.7\"/><path class=\"grat\" d=\"M319.5,426.7L319.5,-26.7\"/><path class=\"grat\" d=\"M368.3,426.7L368.3,-26.7\"/><path class=\"grat\" d=\"M <script>(function(){
const D = window.TEP_DATA, M = D.mods, byId = Object.fromEntries(M.map(m=>[m.id,m]));
const STEPS = [['arrive','Arrive'],['explore','Explore'],['words','Words'],['thennow','Then & Now'],['quiz','Quiz'],['boss','Boss']];
const RANKS = [[0,'Rookie'],[150,'Scout'],[400,'Navigator'],[800,'Pathfinder'],[1300,'Master Explorer']];
const KEY='tep.v1';
let S = load();
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.mods) return s; }catch(e){} return {name:'',xp:0,mods:{}}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function ms(id){ return S.mods[id] || (S.mods[id]={steps:{},opened:[],known:[],quizBest:0,boss:'',stamp:false,pick:null,said:false}); }
const $ = (s,el=document)=>el.querySelector(s);
const esc = t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img = n=>`img/${n}.jpg`;
function stampHTML(m, cls=''){ return m.stamp==='stamp-citizen' ? D.citizenStamp.replace('<svg','<svg class="cst '+cls+'"') : `<img class="${cls}" src="img/${m.stamp}.png" alt="${esc(m.short)} stamp">`; }
function rank(xp){ let r=RANKS[0], nx=null; for(let i=0;i<RANKS.length;i++){ if(xp>=RANKS[i][0]){r=RANKS[i]; nx=RANKS[i+1]||null;} } return {name:r[1], base:r[0], next:nx}; }
function stampsCount(){ return M.filter(m=>ms(m.id).stamp).length; }
function stepsDone(id){ const st=ms(id).steps; return STEPS.filter(([k])=>st[k]).length; }

let toastT;
function toast(msg){ const old=$('.toast'); if(old) old.remove(); const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),1900); }
function addXP(n, why){ S.xp+=n; save(); updateBar(); if(why) toast(`+${n} XP · ${why}`); }
function updateBar(){ $('#xpc').textContent = S.xp+' XP'; $('#stc').textContent = stampsCount()+'/12'; }

/* ---------- HOME ---------- */
function home(){
  const r=rank(S.xp), pct = r.next ? Math.round((S.xp-r.base)/(r.next[0]-r.base)*100) : 100;
  const nm = (S.name||'EXPLORER').toUpperCase().replace(/[^A-Z]/g,'').slice(0,14)||'EXPLORER';
  const mrz1 = ('P<USATIMEXPLORER<<'+nm+'<'.repeat(44)).slice(0,44);
  const mrz2 = ('TEP'+String(S.xp).padStart(5,'0')+'<5USA<'+String(stampsCount()).padStart(2,'0')+'STAMPS<<3500BCE<1600CE'+'<'.repeat(44)).slice(0,44);
  const groups = [['Quarter 1','Q1'],['Quarter 2','Q2'],['Quarters 3 and 4',['Q3–Q4','Q4']]];
  const optNote = {fertile:'Class studies 2 of the 4 in Unit 3. You can explore all 4.',greece:'Class studies Greece or Rome. Explore both!',africa:'Class studies Africa or SW Asia. Explore both!'};
  const card = m=>{ const st=ms(m.id), n=stepsDone(m.id);
    const th = m.hero ? `style="background-image:url('${img(m.hero)}')"` : '';
    return `<button class="mcard" data-go="${m.id}" aria-label="${esc(m.title)}, ${n} of 6 steps done${st.stamp?', stamp earned':''}">
      <div class="thumb" ${th}>${m.hero?'':D.citizenBanner.replace('<svg','<svg style="width:100%;height:100%;display:block" preserveAspectRatio="xMidYMid slice"')}<span class="tag">${esc(m.unit)}</span>${st.stamp?`<span class="got">${stampHTML(m)}</span>`:''}</div>
      <div class="body"><h4>${esc(m.title)}</h4><div class="meta">${esc(m.years)} · ${esc(m.region)}</div>
      ${optNote[m.id]?`<div class="opt">${optNote[m.id]}</div>`:''}
      <div class="segs" aria-hidden="true">${STEPS.map(([k])=>`<i class="${st.steps[k]?'on':''}"></i>`).join('')}</div></div></button>`; };
  const html = `
  <section class="datapage" aria-label="Explorer passport">
    <div class="dp-head"><div class="t">TIME EXPLORER PASSPORT<span>GRADE 5 · WORLD CULTURES · FCPS</span></div>${D.globeMark.replace('<svg','<svg width="38" height="38"')}</div>
    <div class="dp-body">

const TLC={citizen:'#2fc0b1',cultures:'#b8e04f',fertile:'#d9b45f',china:'#e07a5f',india:'#f2a541',meso:'#7bc96f',greece:'#6fb1e8',rome:'#e46a6a',africa:'#c79bd8',swasia:'#5fd3c4',gatp:'#ffffff',europe:'#f0d68e'};
function buildTimeline(){
  if(!Array.isArray(S.tlHide)) S.tlHide=[];
  const withEv = M.filter(m=>m.timeline.length);
  const tlf=$('#tlf');
  if(tlf){
    const anyHidden = S.tlHide.length>0;
    tlf.innerHTML = withEv.map(m=>{ const on=!S.tlHide.includes(m.id); return `<button class="tlchip" data-tl="${m.id}" aria-pressed="${on}"><i style="--c:${TLC[m.id]}"></i>${esc(m.short)}</button>`; }).join('')
      + (anyHidden ? `<button class="tlchip all" data-tlall>Show all</button>` : '');
    tlf.onclick = e=>{
      const c=e.target.closest('[data-tl]');
      if(c){ const id=c.dataset.tl; S.tlHide = S.tlHide.includes(id) ? S.tlHide.filter(x=>x!==id) : [...S.tlHide,id]; save(); buildTimeline(); const f=$(`[data-tl="${id}"]`); if(f) f.focus(); }
      if(e.target.closest('[data-tlall]')){ S.tlHide=[]; save(); buildTimeline(); }
    };
  }
  const evs=[]; M.filter(m=>!S.tlHide.includes(m.id)).forEach(m=>m.timeline.forEach(t=>evs.push({...t,m})));
  evs.sort((a,b)=>a.y-b.y);
  const y0=-3600, y1=1850, W=Math.round((y1-y0)*0.62), X=y=>40+(y-y0)/(y1-y0)*(W-80);
  const colors=TLC;
  let ticks=''; for(let y=-3500;y<=1500;y+=500){ ticks+=`<div class="tl-tick" style="left:${X(y)}px">${y<0?(-y)+' BCE':y===0?'1 CE':y+' CE'}</div>`; }
  // Lanes: 4 above the axis, 4 below. Each event takes the nearest lane whose last label has ended.
  const LW=150, LANES=4, LH=66;
  const lanes=[]; for(let i=0;i<LANES;i++){ lanes.push({side:'up',i,last:-1e9}); lanes.push({side:'dn',i,last:-1e9}); }
  const placed=evs.map(e=>{ let x=X(e.y);
    let ln=lanes.find(l=>x-l.last>=LW+8);
    if(!ln){ ln=lanes.reduce((a,b)=>a.last<b.last?a:b); x=Math.max(x, ln.last+LW+8); }
    ln.last=x; return {e,x,ln}; });
  const maxI=side=>Math.max(-1,...placed.filter(p=>p.ln.side===side).map(p=>p.ln.i));
  const UP=(maxI('up')+1)*LH+48, DN=(maxI('dn')+1)*LH+48;
  let evh='';
  placed.forEach(({e,x,ln})=>{
    const yr = e.y<0?(-e.y)+' BCE':e.y+' CE';
    const off = ln.i*LH+40;
    const pos = ln.side==='up' ? `bottom:${DN+off}px` : `top:${UP+off}px`;
    const stem = ln.side==='up' ? `height:${off}px;bottom:-${off}px` : `height:${off}px;top:-${off}px`;
    evh+=`<div class="tl-ev" style="left:${x}px;${pos}"><span class="stem" style="${stem}"></span><span class="dot" style="background:${colors[e.m.id]};${ln.side==='up'?`bottom:-${off+6}px`:`top:-${off+6}px`}"></span><button class="lnk" data-go="${e.m.id}"><b>${yr}</b>${esc(e.e)}</button></div>`; });
  const tlin=$('#tlin'); tlin.style.width=Math.max(W, ...lanes.map(l=>l.last+LW+40))+'px'; tlin.style.height=(UP+DN)+'px';
  tlin.innerHTML=`<div class="tl-axis" style="top:${UP-1}px"></div>${ticks.replace(/class="tl-tick" style="/g,`class="tl-tick" style="top:${UP-8}px;`)}${evh}`;
}

   <div class="mhero" style="position:relative">${heroMedia}<div class="shade"><div class="eyebrow">${esc(m.unit)} · ${esc(m.q)}</div><h1>${esc(m.title)}</h1>
   <div class="sub"><span class="pill g">${esc(m.years)}</span><span class="pill">${esc(m.region)}</span></div></div></div>
   ${m.heroCap?`<p class="cap"><b>ARTIST'S SCENE</b>${esc(m.heroCap.replace(/^Artist's scene( of)?:?\s*/i,'').replace(/^./,c=>c.toUpperCase()))}</p>`:''}
   ${guideHTML}
   <nav class="steps" id="steps" aria-label="Mission steps"></nav><section id="stage" class="vpage" tabindex="-1"></section>`;
  renderSteps(); renderStep();
  window.scrollTo({top:0});
}
function firstOpen(id){ const st=ms(id).steps; const f=STEPS.find(([k])=>!st[k]); return f?f[0]:'arrive'; }
function renderSteps(){
  const st=ms(cur.id).steps;
  const backBtn = `<button class="step" data-home style="background:var(--panel-2)">← Back</button>`;
  $('#steps').innerHTML = backBtn + STEPS.map(([k,l],i)=>`<button class="step ${k===step?'cur':''} ${st[k]?'done':''}" data-step="${k}" ${k===step?'aria-current="step"':''}><span class="n">${st[k]?'✓':i+1}</span>${l}</button>`).join('');
  const c=$('.step.cur'); if(c) c.scrollIntoView({block:'nearest',inline:'center'});
}
function goStep(k){ step=k; renderSteps(); renderStep(); const s=$('#steps'); window.scrollTo({top: s.getBoundingClientRect().top + window.scrollY - 70, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
function complete(k, xp, why){ const st=ms(cur.id); if(!st.steps[k]){ st.steps[k]=true; save(); if(xp) addXP(xp, why); } renderSteps(); }
function nextBtn(label, k){ return `<div class="nextrow"><button class="btn gold" data-next="${k}">${label} →</button></div>`; }
function nextOf(k){ const i=STEPS.findIndex(s=>s[0]===k); return STEPS[i+1]?STEPS[i+1][0]:null; }

function renderStep(){ const f={arrive,explore,words,thennow,quiz,boss}[step]; f(); }

function arrive(){

  const pimg = pmap[key] ? `<img src="img/${pmap[key]}.jpg" alt="${esc(p.n)}" style="width:64px;height:80px;object-fit:cover;border-radius:10px;border:2px solid var(--gold);flex-shrink:0;">` : '';

function explore(){
  const m=cur, st=ms(m.id);
  let sel = st.opened.length && st.opened.length<m.cards.length ? m.cards.findIndex((c,i)=>!st.opened.includes(i)) : 0;
  const labels = !m.cardsTitle;
  function draw(){
    if(!st.opened.includes(sel)){ st.opened.push(sel); save(); addXP(5,'card opened'); }
    const c=m.cards[sel], all=st.opened.length===m.cards.length;
    const iconMap = {G:'icon-geo',R:'icon-religion',A:'icon-achieve',P:'icon-politics',E:'icon-economy',S:'icon-social'};
    const icon = iconMap[c.k] ? `<img src="img/${iconMap[c.k]}.jpg" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:12px;border:2px solid var(--gold);margin-bottom:6px;">` : '';

     <p style="margin:4px 0 8px;color:var(--page-muted)">Open every ${m.seq?'step':'card'}. ${st.opened.length}/${m.cards.length} opened.</p>
     <div class="tiles ${labels?'has-labels':''}" role="tablist">${m.cards.map((x,i)=>`<button class="tile ${st.opened.includes(i)?'seen':''} ${i===sel?'cur':''}" role="tab" aria-selected="${i===sel}" data-tile="${i}" aria-label="${esc(x.t)}">${esc(x.k)}${labels?`<small>${esc(x.t)}</small>`:''}</button>`).join('')}</div>
     <article class="gcard" role="tabpanel"><div class="big" aria-hidden="true" style="display:flex;flex-direction:column;align-items:center;">${icon}${esc(c.k)}</div><h3>${esc(c.t)}</h3><p>${esc(c.x)}</p><div class="dyk"><b>DID YOU KNOW?</b>${esc(c.f)}</div></article>
     <div class="nextrow">${!all?`<button class="btn" data-tilenext>Next card</button>`:''}<button class="btn gold" data-next="words">On to Words →</button></div>`;
    if(all) complete('explore',0);
  }
  $('#stage').onclick = e=>{ const t=e.target.closest('[data-tile]'); if(t){ sel=+t.dataset.tile; draw(); $('[data-tile="'+sel+'"]').focus(); }
    if(e.target.closest('[data-tilenext]')){ const n=m.cards.findIndex((x,i)=>!st.opened.includes(i)); sel = n>=0?n:(sel+1)%m.cards.length; draw(); } };
  draw();
}

function words(){
  const m=cur, st=ms(m.id);
  let deck = m.vocab.map((v,i)=>i).filter(i=>!st.known.includes(i));
  if(!deck.length){ st.known=[]; deck=m.vocab.map((v,i)=>i); }
  let flipped=false;
  function draw(){
    const done = st.known.length>=m.vocab.length;
    if(done){
      $('#stage').innerHTML = `<div class="kicker">Step 3 · Words</div><h2>All ${m.vocab.length} words learned!</h2><p class="lead">Time to move your body before the next step.</p><div class="nextrow"><button class="btn ghost" data-redeck>Practice again</button><button class="btn gold" data-move>Movement break →</button></div>`;
      complete('words',0); return; }
    const v=m.vocab[deck[0]];
    $('#stage').innerHTML = `<div class="kicker">Step 3 · Words</div><h2>Word cards</h2><p style="margin:4px 0 14px;color:var(--page-muted)">Say the meaning out loud, then flip to check.</p>
     <div class="flash-wrap"><button class="flash ${flipped?'flip':''}" data-flip aria-label="Flashcard: ${esc(v.t)}. Tap to flip."><div class="in"><div class="face front"><small>Word</small>${esc(v.t)}</div><div class="face back"><small>Meaning</small>${esc(v.d)}</div></div></button>
     <div class="count">${st.known.length}/${m.vocab.length} known</div>
     <div class="fbtns"><button class="btn ghost" data-again ${flipped?'':'disabled'}>Not yet</button><button class="btn teal" data-got ${flipped?'':'disabled'}>Got it ✓</button></div></div>`;
  }
  $('#stage').onclick = e=>{
    if(e.target.closest('[data-flip]')){ flipped=!flipped; draw(); setTimeout(()=>{const f=$('[data-flip]'); if(f){f.classList.toggle('flip',flipped); f.focus();}},10); }
    else if(e.target.closest('[data-got]')){ const i=deck.shift(); if(!st.known.includes(i)){ st.known.push(i); save(); addXP(2); } flipped=false; draw(); }
    else if(e.target.closest('[data-again]')){ deck.push(deck.shift()); flipped=false; draw(); }
    else if(e.target.closest('[data-redeck]')){ st.known=[]; save(); deck=m.vocab.map((v,i)=>i); draw(); }
    else if(e.target.closest('[data-move]')) moveBreak();
  };
  draw();
}

function moveBreak(){
  const m=cur; let t=30; const C=2*Math.PI*62;
  const ov=document.createElement('div'); ov.className='ov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-label','Movement break');
  ov.innerHTML=`<div class="ov-card"><div class="eyebrow" style="color:var(--teal)">Movement break · 30 seconds</div><h2>Move!</h2><p style="font-size:18px">${esc(m.move)}</p>
   <svg class="ring-t" viewBox="0 0 150 150" aria-hidden="true"><circle class="bg" cx="75" cy="75" r="62"/><circle class="fg" cx="75" cy="75" r="62" stroke-dasharray="${C}" stroke-dashoffset="0" transform="rotate(-90 75 75)"/><text x="75" y="91" text-anchor="middle">30</text></svg>
   <div class="nextrow" style="justify-content:center"><button class="btn ghost" data-skip>Skip</button><button class="btn teal" data-done disabled>Done!</button></div></div>`;
  document.body.appendChild(ov); $('[data-skip]',ov).focus();
  const fg=$('.fg',ov), tx=$('text',ov), done=$('[data-done]',ov);
  const iv=setInterval(()=>{ t--; tx.textContent=Math.max(t,0); fg.style.strokeDashoffset = C*(1-t/30); if(t<=0){ clearInterval(iv); done.disabled=false; done.focus(); } },1000);
  const close=(earn)=>{ clearInterval(iv); ov.remove(); const st=ms(m.id); if(earn && !st.steps.move){ st.steps.move=true; save(); addXP(5,'movement break'); } goStep('thennow'); };
  ov.onclick=e=>{ if(e.target.closest('[data-done]')) close(true); if(e.target.closest('[data-skip]')) close(false); };
}

function thennow(){

     ${m.timeline.length?`<div class="kicker" style="margin-top:18px">Timeline stops</div><div class="mtl">${m.timeline.map(t=>`<span><b>${t.y<0?(-t.y)+' BCE':t.y+' CE'}</b>${esc(t.e)}</span>`).join('')}</div>`:''}

function quiz(){
  const m=cur, st=ms(m.id);
  let order = m.quiz.map((q,i)=>i).sort(()=>Math.random()-.5), qi=0, res=[], answered=null;
  function draw(){
    if(qi>=order.length){
      const sc=res.filter(Boolean).length, pass=sc>=6;
      if(sc>st.quizBest){ st.quizBest=sc; save(); }
      $('#stage').innerHTML = `<div class="kicker">Step 5 · Quiz</div><div class="score"><div class="big">${sc}/8</div>
       <p>${pass? (sc===8?'Perfect score! Quiz cleared.':'Quiz cleared! 6 or more is a pass.') : 'You need 6 to pass. Look back at the cards you missed, then try again.'}</p></div>
       <div class="nextrow" style="justify-content:center"><button class="btn ghost" data-retry>Try again</button>${pass?`<button class="btn gold" data-next="boss">Face the boss →</button>`:`<button class="btn" data-back="explore">Review cards</button>`}</div>`;
      if(pass) complete('quiz',20,'quiz cleared');
      return; }
    const q=m.quiz[order[qi]];
    $('#stage').innerHTML = `<div class="kicker">Step 5 · Quiz</div>
     <div class="qtop"><span class="count">Question ${qi+1} of 8</span><span class="qdots" aria-hidden="true">${order.map((o,i)=>`<i class="${i<res.length?(res[i]?'r':'w'):''} ${i===qi?'c':''}"></i>`).join('')}</span></div>
     <div class="qq" id="qq">${esc(q.q)}</div>
     <div class="opts" role="group" aria-labelledby="qq">${q.c.map((c,i)=>{ let cl=''; if(answered!==null){ if(i===q.a) cl='right'; else if(i===answered) cl='wrong'; }
       return `<button class="opt ${cl}" data-opt="${i}" ${answered!==null?'aria-disabled="true"':''}><span class="l">${'ABCD'[i]}</span>${esc(c)}</button>`; }).join('')}</div>
     ${answered!==null?`<div class="why ${answered===q.a?'ok':'no'}" role="status"><b>${answered===q.a?'CORRECT!':'NOT QUITE'}</b>${esc(q.w)}</div><div class="nextrow"><button class="btn gold" data-qnext>${qi===7?'See score':'Next question'} →</button></div>`:''}`;
  }
  $('#stage').onclick=e=>{
    const o=e.target.closest('[data-opt]');
    if(o && answered===null){ answered=+o.dataset.opt; const ok=answered===m.quiz[order[qi]].a; res.push(ok); if(ok) addXP(5); draw(); $('[data-qnext]').focus(); }
    else if(e.target.closest('[data-qnext]')){ qi++; answered=null; draw(); const f=$('.opt')||$('[data-retry]'); if(f) f.focus(); }
    else if(e.target.closest('[data-retry]')){ order=order.sort(()=>Math.random()-.5); qi=0; res=[]; answered=null; draw(); }
  };
  draw();
}

function boss(){
  const m=cur, st=ms(m.id), a=m.aap;
  let shown = st.hintsShown||0, reveal = !!st.steps.boss;
  function wc(t){ return (t.trim().match(/\S+/g)||[]).length; }
  function draw(){
    const n=wc(st.boss), ready = n>=25 || st.said;
    $('#stage').innerHTML = `<div class="kicker">Step 6 · Boss challenge</div><span class="boss-tag">⚑ AAP LEVEL</span>
     <h2 style="margin-top:10px">${esc(a.t)}</h2><p class="prompt">${esc(a.p)}</p>
     <div class="hints">${a.h.slice(0,shown).map((h,i)=>`<div class="hint"><b>HINT ${i+1}</b>${esc(h)}</div>`).join('')}</div>
     ${shown<a.h.length?`<button class="btn ghost" data-hint>Show hint ${shown+1} of ${a.h.length}</button>`:''}
     <div style="margin-top:14px"><label for="ans-${m.id}" class="kicker" style="display:block">Your answer</label>
     <textarea id="ans-${m.id}" placeholder="Make a claim, then give your evidence…">${esc(st.boss)}</textarea>
     <div class="wc"><span id="wcn">${n} words · aim for 25+</span><span>Saved on this device</span></div>
     <label class="check"><input type="checkbox" id="said-${m.id}" ${st.said?'checked':''}> I explained my answer out loud to a grown-up instead</label></div>
     ${reveal?`<div class="model"><b>ONE STRONG ANSWER</b>${esc(a.m)}</div>
       <div class="selfcheck"><div class="kicker" style="margin-top:8px">Check yours</div>
       <label class="check"><input type="checkbox"> I made a clear claim</label><label class="check"><input type="checkbox"> I used at least 2 facts as evidence</label><label class="check"><input type="checkbox"> I connected it to today or to another culture</label></div>
       <div class="nextrow"><button class="btn gold" data-finish>${st.stamp?'Back to passport':'Claim my stamp!'}</button></div>`
     :`<div class="nextrow"><button class="btn gold" data-reveal ${ready?'':'disabled'}>${ready?'Compare with a model answer →':'Write 25 words to unlock'}</button></div>`}`;
    const ta=$('textarea');
    ta.oninput=()=>{ st.boss=ta.value; save(); const k=wc(ta.value); $('#wcn').textContent=k+' words · aim for 25+'; const b=$('[data-reveal]'); if(b){ const r=k>=25||st.said; b.disabled=!r; b.textContent = r?'Compare with a model answer →':'Write 25 words to unlock'; } };
    $('#said-'+m.id).onchange=e=>{ st.said=e.target.checked; save(); draw(); };
  }
  $('#stage').onclick=e=>{
    if(e.target.closest('[data-hint]')){ shown++; st.hintsShown=shown; save(); draw(); }
    else if(e.target.closest('[data-reveal]')){ reveal=true; complete('boss',25,'boss defeated'); draw(); $('.model').scrollIntoView({block:'center'}); }
    else if(e.target.closest('[data-finish]')){ if(!st.stamp) tryStamp(); else location.hash=''; }
  };
  draw();
}

function tryStamp(){
  const m=cur, st=ms(m.id), missing=STEPS.filter(([k])=>!st.steps[k]);
  if(missing.length){ toast('Finish: '+missing.map(s=>s[1]).join(', ')); goStep(missing[0][0]); return; }
  st.stamp=true; save(); addXP(50);
  const ov=document.createElement('div'); ov.className='ov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-label','Stamp earned');
  ov.innerHTML=`<div class="ov-card"><div class="eyebrow" style="color:var(--teal)">Mission complete · +50 XP</div><div class="stamp-drop">${stampHTML(m)}</div><h2>${esc(m.short)} stamp earned!</h2><p>${stampsCount()} of 12 stamps in your passport.</p><div class="nextrow" style="justify-content:center"><button class="btn gold" data-ok>Back to passport</button></div></div>`;
  document.body.appendChild(ov); $('[data-ok]',ov).focus();
  ov.onclick=e=>{ if(e.target.closest('[data-ok]')){ ov.remove(); location.hash=''; } };
}

/* ---------- routing & global clicks ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ location.hash=g.dataset.go; return; }
  if(e.target.closest('[data-home]')){ location.hash=''; return; }
  const st=e.target.closest('[data-step]'); if(st){ goStep(st.dataset.step); return; }
  const n=e.target.closest('[data-next]'); if(n){ const k=n.dataset.next; if(step==='arrive') complete('arrive',5,'arrived'); goStep(k); return; }
  const b=e.target.closest('[data-back]'); if(b){ goStep(b.dataset.back); return; }
});
document.addEventListener('keydown',e=>{ const p=e.target.closest&&e.target.closest('.pin'); if(p && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); location.hash=p.dataset.id; } });
document.addEventListener('click',e=>{ const p=e.target.closest('.pin'); if(p) location.hash=p.dataset.id; });
$('#brand').onclick=()=>{ location.hash=''; };
/* ---------- day / night ---------- */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"/></svg>';
const mq = matchMedia('(prefers-color-scheme: dark)');
function themeNow(){ const a=document.documentElement.getAttribute('data-theme'); return a==='dark'||a==='light' ? a : (mq.matches?'dark':'light'); }
function paintThemeBtn(){ const b=$('#themebtn'); if(!b) return; const dark=themeNow()==='dark';
  b.innerHTML = dark ? SUN : MOON; b.setAttribute('aria-label', dark?'Switch to day mode':'Switch to night mode'); }
$('#themebtn').onclick=()=>{ const next = themeNow()==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next); try{ localStorage.setItem('tep.theme', next); }catch(e){}
  paintThemeBtn(); toast(next==='dark' ? 'Night mode on' : 'Day mode on'); };
mq.addEventListener && mq.addEventListener('change', paintThemeBtn);
new MutationObserver(paintThemeBtn).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
paintThemeBtn();
function route(){ const h=location.hash.slice(1); if(byId[h]) openModule(h); else { cur=null; home(); window.scrollTo({top:0}); } }
window.addEventListener('hashchange',route);
updateBar(); route();
})();
</script>

</body></html>
